<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerobak Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 6px;
      padding: 6px 10px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topbar">
    <div id="role"></div>
    <div id="status">Not sharing</div>
    <div id="controls"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    /* ===============================
       BASIC SETUP
    =============================== */

    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || "customer";
    const vendorId =
      params.get("vendorId") ||
      "vendor_" + Math.random().toString(36).slice(2, 8);

    const socket = io();
    document.getElementById("role").innerText = "Role: " + role;

    const map = L.map("map").setView([-6.2, 106.8166], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    let watchId = null;
    let myMarker = null;
    const vendorMarkers = new Map();

    const vendorIcon = L.icon({
      iconUrl: "https://cdn-icons-png.flaticon.com/512/3075/3075977.png",
      iconSize: [32, 32],
      iconAnchor: [16, 32]
    });

    /* ===============================
       VENDOR MODE
    =============================== */
    if (role === "vendor") {

      // Prompt vendor to enter their Gerobak name first
      let gerobakName = prompt("Enter your Gerobak name:", "Gerobak " + vendorId.slice(-3));
      if (!gerobakName || gerobakName.trim() === "") {
        gerobakName = "Gerobak " + vendorId.slice(-3);
      }

      document.getElementById("controls").innerHTML = `
        <div><strong>ID:</strong> ${vendorId}</div>
        <div><strong>Name:</strong> <span id="gerobakNameDisplay">${gerobakName}</span> 
          <button id="changeNameBtn">Change</button>
        </div>
        <button id="start">Start sharing</button>
        <button id="stop">Stop sharing</button>
      `;

      socket.emit("registerVendor", {
        vendorId,
        meta: { name: gerobakName }
      });

      // Change Gerobak name
      document.getElementById("changeNameBtn").onclick = () => {
        const newName = prompt("Enter new Gerobak name:", gerobakName);
        if (newName && newName.trim() !== "") {
          gerobakName = newName.trim();
          document.getElementById("gerobakNameDisplay").innerText = gerobakName;
          socket.emit("updateVendorName", { vendorId, name: gerobakName });
        }
      };

      // Start sharing location
      document.getElementById("start").onclick = () => {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }
        if (watchId !== null) return;

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            document.getElementById("status").innerText = "Sharing location";

            socket.emit("vendorLocationUpdate", {
              vendorId,
              lat: latitude,
              lng: longitude,
              name: gerobakName
            });

            if (!myMarker) {
              myMarker = L.marker([latitude, longitude], { icon: vendorIcon })
                .addTo(map)
                .bindPopup(gerobakName);
              map.setView([latitude, longitude], 16);
            } else {
              myMarker.setLatLng([latitude, longitude])
                      .setPopupContent(gerobakName);
            }
          },
          err => {
            alert("Location error: " + err.message);
          },
          { enableHighAccuracy: true }
        );
      };

      // Stop sharing location
      document.getElementById("stop").onclick = () => {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        document.getElementById("status").innerText = "Stopped sharing";
        socket.emit("vendorStop", { vendorId });
        if (myMarker) {
          map.removeLayer(myMarker);
          myMarker = null;
        }
      };
    }

    /* ===============================
       CUSTOMER MODE
    =============================== */
    else {
      document.getElementById("controls").innerHTML = `
        <button id="share">Share my location</button>
      `;

      document.getElementById("share").onclick = () => {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            document.getElementById("status").innerText = "You are here";

            if (!myMarker) {
              myMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                color: "#007AFF",
                fillColor: "#007AFF",
                fillOpacity: 0.9
              }).addTo(map).bindPopup("You (Customer)");
            } else {
              myMarker.setLatLng([latitude, longitude]);
            }

            map.setView([latitude, longitude], 16);
          },
          err => {
            alert("Location error: " + err.message);
          }
        );
      };

      // Vendor updates on customer map
      socket.on("vendorPosition", data => {
        let marker = vendorMarkers.get(data.vendorId);
        if (!marker) {
          marker = L.marker([data.lat, data.lng], { icon: vendorIcon })
            .addTo(map)
            .bindPopup(data.name || data.vendorId);
          vendorMarkers.set(data.vendorId, marker);
        } else {
          marker.setLatLng([data.lat, data.lng])
                .setPopupContent(data.name || data.vendorId);
        }
      });

      socket.on("vendorGone", data => {
        const marker = vendorMarkers.get(data.vendorId);
        if (marker) {
          map.removeLayer(marker);
          vendorMarkers.delete(data.vendorId);
        }
      });
    }
  </script>
</body>
</html>
