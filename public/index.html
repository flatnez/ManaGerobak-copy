const safeSpotsData = [
    {

];

// Kita pisah layernya menjadi 2: untuk Lingkaran dan untuk Marker (Icon)
let safeSpotsCirclesLayer = L.layerGroup();
let safeSpotsMarkersLayer = L.layerGroup();
const ZOOM_THRESHOLD = 15; // Batas zoom kapan berubah dari icon ke lingkaran

// FUNGSI UNTUK MENGGAMBAR SAFE SPOTS
function renderSafeSpots() {
    safeSpotsCirclesLayer.clearLayers(); 
    safeSpotsMarkersLayer.clearLayers();
    
    safeSpotsData.forEach(spot => {
        let spotColor, fillOpacity;

        if (spot.type === 'green') { 
            spotColor = '#28a745'; fillOpacity = 0.4;
        } else if (spot.type === 'yellow') { 
            spotColor = '#ffc107'; fillOpacity = 0.4;
        } else if (spot.type === 'red') { 
            spotColor = '#dc3545'; fillOpacity = 0.5;
        }

        const popupContent = `
            <div style="font-family: sans-serif; text-align: center;">
                <h4 style="margin: 0 0 5px 0;">${t(spot.nameKey)}</h4>
                <p style="margin: 0; font-size: 14px;">${t(spot.descKey)}</p>
            </div>
        `;

        // 1. Buat Lingkaran
        const areaCircle = L.circle([spot.lat, spot.lng], {
            color: spotColor, fillColor: spotColor, fillOpacity: fillOpacity, weight: 2, radius: 50
        });
        areaCircle.bindPopup(popupContent);
        safeSpotsCirclesLayer.addLayer(areaCircle);

        // 2. Buat Marker Icon
        const zoneMarker = L.marker([spot.lat, spot.lng], { icon: gerobakZoneIcon });
        
        // Ketika Icon diklik, zoom ke lokasi dan buka popup lingkarannya
        zoneMarker.on('click', function() {
            map.flyTo([spot.lat, spot.lng], 16, { animate: true, duration: 0.5 });
            map.once('moveend', function() {
                areaCircle.openPopup();
            });
        });
        safeSpotsMarkersLayer.addLayer(zoneMarker);
    });

    updateSafeSpotsVisibility(); // Tentukan mana yang muncul saat pertama diload
}

// FUNGSI MENGATUR VISUAL BERDASARKAN ZOOM
function updateSafeSpotsVisibility() {
    if (!map) return;
    const currentZoom = map.getZoom();
    
    if (currentZoom >= ZOOM_THRESHOLD) {
        // Zoom in: Tampilkan Lingkaran, hapus Marker Icon
        if (map.hasLayer(safeSpotsMarkersLayer)) map.removeLayer(safeSpotsMarkersLayer);
        if (!map.hasLayer(safeSpotsCirclesLayer)) map.addLayer(safeSpotsCirclesLayer);
    } else {
        // Zoom out: Tampilkan Marker Icon, hapus Lingkaran
        if (map.hasLayer(safeSpotsCirclesLayer)) map.removeLayer(safeSpotsCirclesLayer);
        if (!map.hasLayer(safeSpotsMarkersLayer)) map.addLayer(safeSpotsMarkersLayer);
    }
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; 
}

function handleSearch() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const resultsDiv = document.getElementById("searchResults");
    resultsDiv.innerHTML = "";

    let activeVendors = [];
    Object.keys(vendorMarkers).forEach(id => {
        const marker = vendorMarkers[id];
        const vData = marker.options.vendorData;
        
        const name = (vData.nama || "Gerobak").toLowerCase();
        
        if (query === "" || name.includes(query)) {
            const vLat = parseFloat(vData.lat);
            const vLng = parseFloat(vData.lng);
            const dist = getDistance(userCurrentLat, userCurrentLng, vLat, vLng);
            
            activeVendors.push({
                id: id,
                data: vData,
                dist: dist
            });
        }
    });

    activeVendors.sort((a, b) => a.dist - b.dist);

    if (activeVendors.length === 0) {
        resultsDiv.innerHTML = `<div style='padding:20px; text-align:center; color:#ffffff; opacity: 50%;'>${t('msg_no_result')}</div>`;
        return;
    }

    activeVendors.forEach(item => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.onclick = function() {
            selectSearchedVendor(item.id, item.data);
        };
        
        const distText = item.dist < 1 
            ? (item.dist * 1000).toFixed(0) + t('dist_meter') 
            : item.dist.toFixed(1) + t('dist_km');
        
        const statusText = (item.data.status === 'keliling') ? t('status_keliling_search') : t('status_mangkal_search');

        div.innerHTML = `
            <div class="item-info">
                <b>${item.data.nama || "Gerobak"}</b>
                <span style="font-size:0.8rem; color:#becc8b;">${statusText}</span> </div>
            <div class="item-dist">📍 ${distText}</div>
        `;
        resultsDiv.appendChild(div);
    });
}

    if(map) {

}

function startSharingLocation() {
    if (!navigator.geolocation) return alert("Browser tidak mendukung Geolocation");
    if (!currentUser) return;

    document.getElementById("btnStartShare").innerText = "⏳...";
    
    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        
        userCurrentLat = lat;
        userCurrentLng = lng;
        
        map.setView([lat, lng], 17);
        
        watchID = navigator.geolocation.watchPosition(updatePositionToDB, handleError, { enableHighAccuracy: true });
        
        resetLocationButtons(true);
        isSharingLocally = true;

    }, handleError);
}

function updatePositionToDB(pos) {
    if (!currentUser) return;
    
    userCurrentLat = pos.coords.latitude;
    userCurrentLng = pos.coords.longitude;

    const updates = {
        lat: pos.coords.latitude, 
        lng: pos.coords.longitude,
        isLive: true,
        lastUpdated: firebase.database.ServerValue.TIMESTAMP
    };

    const vendorRef = db.ref("vendors/" + currentUser.uid);
    vendorRef.update(updates);
    vendorRef.onDisconnect().update({ isLive: false });
}

function stopSharingLocation() {
    if (watchID) navigator.geolocation.clearWatch(watchID);
    watchID = null;
    isSharingLocally = false;
    
    if(currentUser) {
        db.ref("vendors/" + currentUser.uid).update({ isLive: false });
        db.ref("vendors/" + currentUser.uid).onDisconnect().cancel();
    }

    resetLocationButtons(false);
    alert(t('msg_stop_share'));
}

function handleError(err) {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (err.code === 1 && isIOS) {
        showiOSLocationHelp(); 
    } else {

function loadVendorsOnMap() {
  if(!map) return;
  
  db.ref("vendors").on("value", snap => {
    const data = snap.val();
    let activeVendorIds = [];
    
    if (data) {
        Object.keys(data).forEach(id => {
          const v = data[id];
          
          if (!v.lat || !v.lng || v.isLive !== true) return;
          
          activeVendorIds.push(id); 
          let lat = parseFloat(v.lat);
          let lng = parseFloat(v.lng);
          
          let displayName = v.nama || t('default_cart_name'); 
          
          if (currentUser && !currentUser.isAnonymous && id === currentUser.uid) {
             // Gunakan t() untuk menambahkan "(Anda)" atau "(You)"
             displayName += " (" + t('lbl_you') + ")";
          }

          let currentIcon = (id === selectedVendorId) ? bigIcon : normalIcon;

          if (vendorMarkers[id]) {
            vendorMarkers[id].setLatLng([lat, lng]);
            vendorMarkers[id].setIcon(currentIcon);
            vendorMarkers[id].options.vendorData = v; 
            
            vendorMarkers[id].bindPopup(`<b>${displayName}</b>`);
            
            if (id === selectedVendorId) {
                vendorMarkers[id].openPopup();
                if (document.getElementById("customerDetailPanel").style.display === "block") {
                    showVendorDetail(v, id);
                }
            }

          } else {
            const newMarker = L.marker([lat, lng], { icon: currentIcon, vendorData: v }).addTo(map);
            newMarker.bindPopup(`<b>${displayName}</b>`);
            newMarker.on('click', function(e) {
                highlightVendorIcon(id);
                showVendorDetail(this.options.vendorData, id);
                map.flyTo([lat, lng], 16, { animate: true, duration: 0.5 });
            });
            vendorMarkers[id] = newMarker;
          }
        });
    }
    
    Object.keys(vendorMarkers).forEach(existingId => {
        if (!activeVendorIds.includes(existingId)) {
            map.removeLayer(vendorMarkers[existingId]);
            delete vendorMarkers[existingId];
            if (existingId === selectedVendorId) {
                closeDetailView();
                alert("Gerobak ini baru saja offline/tutup.");
            }
        }
    });
  });
}

function highlightVendorIcon(id) {
    selectedVendorId = id;
    Object.keys(vendorMarkers).forEach(k => vendorMarkers[k].setIcon(normalIcon));
    
    if (vendorMarkers[id]) {
        vendorMarkers[id].setIcon(bigIcon);
        vendorMarkers[id].openPopup();
    }
}

function updateProfil() {
  if (!currentUser || currentUser.isAnonymous) return;
  const updateBtn = document.getElementById("updateBtn");
  
  // 1. Ganti tombol jadi "Menyimpan..." sesuai bahasa
  let imgSrcMenyimpan = currentLang === "en" ? "image/btn-menyimpan-en.png" : "image/btn-menyimpan.png";
  updateBtn.innerHTML = `<img id="imgSimpan" src="${imgSrcMenyimpan}" alt="Menyimpan...">`;

  let menuArray = rawMenu.split("\n").filter(item => item.trim() !== "");

  db.ref("vendors/" + currentUser.uid).update({

      updateBtn.innerHTML = `<img id="imgSimpan" src="${imgSrcSimpan}" alt="SIMPAN PROFIL">`; 
      updateBtn.disabled = false;
      
      showMyPublicProfile(); 
  }).catch(err => {
      // 4. Alert gagal sesuai bahasa
      let errorMsg = currentLang === "en" ? "Update failed: " : "Gagal update: ";
      alert(errorMsg + err.message);
      
      // 5. Kembalikan tombol ke "Simpan" sesuai bahasa
      let imgSrcSimpan = currentLang === "en" ? "image/btn-simpan-en.png" : "image/btn-simpan.png";

function loadMyFormData(uid) {
    db.ref("vendors/" + uid).once("value").then(snap => {
        const v = snap.val();
        if(v) {
            document.getElementById("namaGerobak").value = v.nama || "";
            
            let currentStatus = v.status || "mangkal";
            if (currentStatus === "buka") currentStatus = "mangkal";
            if (currentStatus === "tutup") currentStatus = "mangkal"; 
            document.getElementById("status").value = currentStatus;
            
            let rawMenuStr = JSON.stringify(v.menu || "");
            let isNewAccount = rawMenuStr.includes("Contoh Menu");

            if (isNewAccount) {
                document.getElementById("jamBuka").value = "";
                document.getElementById("jamTutup").value = "";
                document.getElementById("pengumumanInput").value = "";
                document.getElementById("menu").value = ""; 
                
                currentImageBase64 = "";
                document.getElementById("previewGambar").style.display = "none";
                document.getElementById("hapusFotoBtn").style.display = "none";
            } else {
                document.getElementById("jamBuka").value = v.jamBuka || "";
                document.getElementById("jamTutup").value = v.jamTutup || "";
                document.getElementById("pengumumanInput").value = v.pengumuman || "";

                if (Array.isArray(v.menu)) {
                    cleanMenu = v.menu;
                } else if (v.menu) {
                    cleanMenu = v.menu.replace(/,/g, "\n").split("\n");
                }
                document.getElementById("menu").value = cleanMenu.join("\n");

                if (v.gambar && v.gambar !== "") {
                    currentImageBase64 = v.gambar;
                    document.getElementById("previewGambar").src = v.gambar;
                    document.getElementById("previewGambar").style.display = "block";
                    document.getElementById("hapusFotoBtn").style.display = "inline-block";
                } else {
                    currentImageBase64 = "";
                    document.getElementById("previewGambar").style.display = "none";

                }

        }
    });

function handleImageUpload(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxWidth = 500;
                let scale = 1;
                if (img.width > maxWidth) scale = maxWidth / img.width;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                currentImageBase64 = compressedDataUrl;
                
                const preview = document.getElementById('previewGambar');
                preview.src = compressedDataUrl;
                preview.style.display = "block";
                document.getElementById('hapusFotoBtn').style.display = "inline-block";
            }
        }
        reader.readAsDataURL(file);
    }
}

function enableCustomerLocation() {
  if (!navigator.geolocation) return alert("Geolocation Error");
  
  const locBtn = document.getElementById("customerLocBtn");

  if (customerWatchID !== null) { 
     if(customerMarker) map.setView(customerMarker.getLatLng(), 17);
     return; 
  }

  const customerStyle = { radius: 10, color: "#fff", weight: 3, fillColor: "#007AFF", fillOpacity: 1, pane: 'customerPane' };
  
  // Efek visual loading: buat gambar agak transparan sebagai ganti teks "⏳..."
  if (locBtn) locBtn.style.opacity = "0.5";

  customerWatchID = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    
    // Update global var agar search feature lebih akurat
    userCurrentLat = lat;
    userCurrentLng = lng;

    if (customerMarker) {
        customerMarker.setLatLng([lat, lng]);
    } else {
        customerMarker = L.circleMarker([lat, lng], customerStyle).addTo(map);
        map.setView([lat, lng], 17);
        
        // Kembalikan gambar jadi terang saat lokasi ketemu (pengganti "📍 Lokasi Saya")
        if (locBtn) locBtn.style.opacity = "1";
    }
  }, err => {
      console.error(err);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (err.code === 1 && isIOS) {
          showiOSLocationHelp(); // Panggil popup bantuan
      } else {
          alert(t('msg_loc_denied'));
      }
      
      // Kembalikan gambar jadi terang jika error/ditolak
      if (locBtn) locBtn.style.opacity = "1";
  }, { enableHighAccuracy: true });
}

    }
    
    // Update tampilan detail jika sedang terbuka
    if(selectedVendorId && vendorMarkers[selectedVendorId]) {
         showVendorDetail(vendorMarkers[selectedVendorId].options.vendorData, selectedVendorId);
    }

    // --- TAMBAHKAN INI AGAR POPUP MAP IKUT BERUBAH ---
    if (map && (map.hasLayer(safeSpotsCirclesLayer) || map.hasLayer(safeSpotsMarkersLayer))) {
        renderSafeSpots();
    }
}

// Fungsi untuk menerjemahkan teks dinamis secara otomatis via API Gratis
async function translateDynamicText(text, targetLang) {
    // Jika teks kosong atau bahasa tujuannya adalah Indonesia (asli), kembalikan teks asli
    if (!text || targetLang === "id") return text; 

    try {
        // Menggunakan MyMemory Translation API (Gratis, limit ~500 kata/hari)
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=id|${targetLang}`);
        const data = await response.json();
        
        // Pastikan API mengembalikan hasil yang valid
        if (data && data.responseData && data.responseData.translatedText) {
            return data.responseData.translatedText;
        }
        return text; // Fallback jika gagal parsing
    } catch (error) {
        console.error("Gagal menerjemahkan teks:", error);
        return text; // Tampilkan teks bahasa Indonesia asli jika API error/offline
    }
}

// Resize observer

document.addEventListener("DOMContentLoaded", function() {
    const header = document.querySelector(".header-container");
    const decorBorder = document.querySelector(".decor-border");
    const searchOverlay = document.getElementById("searchOverlay");

if (header) {
        const observer = new ResizeObserver(function(entries) {
            for (let entry of entries) {
                // Subtract 1px right here to pull everything up and hide the gap!
                const headerHeight = entry.target.offsetHeight - 1; 
                
                // 1. Sesuaikan Decor Border
                if (decorBorder) {
                    decorBorder.style.top = headerHeight + "px";
                }
                
                // 2. Sesuaikan Search Overlay (walaupun sedang disembunyikan, posisinya tetap kita siapkan)
                if (searchOverlay) {
                    searchOverlay.style.top = headerHeight + "px";
                    
                    // The calc will now automatically account for the -1px we did above
                    searchOverlay.style.height = `calc(100% - ${headerHeight}px)`;
                }
            }
        });
        observer.observe(header);
    }
});
