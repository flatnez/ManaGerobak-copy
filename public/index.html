<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ManaGerobak?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 6px;
      padding: 6px 10px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topbar">
    <div id="role"></div>
    <div id="status">Not sharing</div>
    <div id="controls"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || "customer";
    let vendorId = params.get("vendorId");
    const socket = io();

    const map = L.map("map").setView([-6.2, 106.8166], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    let watchId = null;
    let myMarker = null;
    const vendorMarkers = new Map();

    const vendorIcon = L.icon({
      iconUrl: "image/kiosk.png",
      iconSize: [32, 32],
      iconAnchor: [16, 32]
    });

    /* ===============================
       iOS Helper
    =============================== */
    function detectBrowser() {
      const ua = navigator.userAgent;

      if (/GSA/i.test(ua)) return "google_app";
      if (/CriOS/i.test(ua)) return "chrome_ios";
      if (/FxiOS/i.test(ua)) return "firefox_ios";
      if (/EdgiOS/i.test(ua)) return "edge_ios";
      if (/OPiOS/i.test(ua)) return "opera_ios";
      if (/DuckDuckGo/i.test(ua)) return "duckduckgo_ios";
      if (/Brave/i.test(ua)) return "brave_ios";
      if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "safari";

      return "other";
    }

    function showiOSLocationHelp() {
      const browser = detectBrowser();
      let message = "";

      switch (browser) {
        case "safari":
          message = `Location could not be accessed.
          
To enable location on iPhone:
Settings → Privacy & Security → Location Services → Safari Websites → "While Using the App"`;
          break;

        case "chrome_ios":
          message = `Location could not be accessed.
          
To enable location:
Settings → Privacy & Security → Location Services → Chrome → "While Using the App"`;
          break;

        default:
          message = `Enable location:
Settings → Privacy & Security → Location Services → your browser → "While Using the App"`;
      }

      alert(message);
    }

    function handleLocationError(err) {
      console.warn("Geolocation error:", err);
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        showiOSLocationHelp();
      } else {
        alert("Location error: " + err.message);
      }
    }

    /* ===============================
       GER OBAK (Vendor) LOGIC
    =============================== */
    if (role === "vendor") {

      if (!vendorId) {
        vendorId = prompt("Masukkan ID Gerobak Anda:", "gerobak1");
        if (!vendorId || vendorId.trim() === "") {
          vendorId = "gerobak_" + Math.random().toString(36).slice(2, 8);
        }
      }

      // Show vendor name in top-left
      document.getElementById("role").innerText = "Gerobak: " + vendorId;

      const controlsDiv = document.getElementById("controls");
      const statusDiv = document.getElementById("status");

      function updateButton() {
        controlsDiv.innerHTML = "";
        const btn = document.createElement("button");
        btn.textContent = watchId === null ? "Start Sharing Location" : "Stop Sharing Location";
        btn.onclick = watchId === null ? startSharing : stopSharing;
        controlsDiv.appendChild(btn);
      }

      socket.emit("registerVendor", {
        vendorId,
        meta: { name: vendorId }
      });

      function startSharing() {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }

        if (watchId !== null) return;

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            statusDiv.innerText = "Sharing location";

            socket.emit("vendorLocationUpdate", {
              vendorId,
              lat: latitude,
              lng: longitude
            });

            if (!myMarker) {
              myMarker = L.marker([latitude, longitude], { icon: vendorIcon })
                .addTo(map)
                .bindPopup(`${vendorId} (Anda)`);
              map.setView([latitude, longitude], 16);
            } else {
              myMarker.setLatLng([latitude, longitude])
                      .setPopupContent(`${vendorId} (Anda)`);
            }
          },
          handleLocationError,
          { enableHighAccuracy: true }
        );

        updateButton();
      }

      function stopSharing() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        statusDiv.innerText = "Stopped sharing";
        socket.emit("vendorStop", { vendorId });

        if (myMarker) {
          map.removeLayer(myMarker);
          myMarker = null;
        }

        updateButton();
      }

      updateButton();
    }

    /* ===============================
       CUSTOMER LOGIC
    =============================== */
    else {
      document.getElementById("role").innerText = "Customer";

      const controlsDiv = document.getElementById("controls");
      const statusDiv = document.getElementById("status");

      const btn = document.createElement("button");
      btn.textContent = "See My Location";
      btn.onclick = shareLocation;
      controlsDiv.appendChild(btn);

      function shareLocation() {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            statusDiv.innerText = "You";

            if (!myMarker) {
              myMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                color: "#007AFF",
                fillColor: "#007AFF",
                fillOpacity: 0.9
              }).addTo(map).bindPopup('<div style="text-align:center">You</div>');
            } else {
              myMarker.setLatLng([latitude, longitude])
                      .setPopupContent('<div style="text-align:center">You</div>');
            }

            map.setView([latitude, longitude], 16);
          },
          handleLocationError
        );
      }

      socket.emit("registerCustomer");

      socket.on("activeVendors", vendors => {
        vendors.forEach(data => {
          let marker = vendorMarkers.get(data.vendorId);
          if (!marker) {
            marker = L.marker([data.lat, data.lng], { icon: vendorIcon })
              .addTo(map)
              .bindPopup(data.vendorId);
            vendorMarkers.set(data.vendorId, marker);
          } else {
            marker.setLatLng([data.lat, data.lng])
                  .setPopupContent(data.vendorId);
          }
        });
      });

      socket.on("vendorPosition", data => {
        let marker = vendorMarkers.get(data.vendorId);
        if (!marker) {
          marker = L.marker([data.lat, data.lng], { icon: vendorIcon })
            .addTo(map)
            .bindPopup(data.vendorId);
          vendorMarkers.set(data.vendorId, marker);
        } else {
          marker.setLatLng([data.lat, data.lng])
                .setPopupContent(data.vendorId);
        }
      });

      socket.on("vendorGone", data => {
        const marker = vendorMarkers.get(data.vendorId);
        if (marker) {
          map.removeLayer(marker);
          vendorMarkers.delete(data.vendorId);
        }
      });
    }
  </script>
</body>
</html>
