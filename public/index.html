<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Gerobak</title>

<!-- Leaflet MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  #map { height: 400px; width: 100%; }
  .panel { padding: 10px; background: #f8f8f8; margin-top: 10px; border-radius: 6px;}
</style>
</head>
<body>

<h2>Map Gerobak</h2>

<div id="map"></div>

<!-- ===================== -->
<!-- PANEL VENDOR          -->
<!-- ===================== -->
<div id="vendorPanel" class="panel" style="display:none;">

  <h3>Kontrol Lokasi Vendor</h3>

  <button id="shareBtn">Mulai Bagikan Lokasi</button>
  <button id="stopBtn">Berhenti Bagikan Lokasi</button>

  <hr>

  <h3>Profil Gerobak</h3>

  <label>Status:</label><br>
  <select id="status">
    <option value="buka">Buka</option>
    <option value="tutup">Tutup</option>
  </select><br><br>

  <label>Jam Buka:</label><br>
  <input id="jamBuka" placeholder="contoh: 08:00"><br><br>

  <label>Jam Tutup:</label><br>
  <input id="jamTutup" placeholder="contoh: 17:00"><br><br>

  <label>Menu (comma separated):</label><br>
  <input id="menu" placeholder="bakso, mie ayam, es teh"><br><br>

  <label>Foto URL:</label><br>
  <input id="gambar" placeholder="https://..."><br><br>

  <button onclick="updateProfil()">Update Profil</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>

const auth = firebase.auth();
const db = firebase.database();

/* ===============================
   AUTH GUARD
================================*/
auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  window.uid = user.uid;
  window.role = localStorage.getItem("role");

  if (window.role === "vendor") {
    document.getElementById("vendorPanel").style.display = "block";
  }

  loadVendorsOnMap();
});

/* ===============================================
        iOS Browser Detection + Location Help Popup
===============================================*/
function detectBrowser() {
  const ua = navigator.userAgent;

  if (/GSA/i.test(ua)) return "google_app";
  if (/CriOS/i.test(ua)) return "chrome_ios";
  if (/FxiOS/i.test(ua)) return "firefox_ios";
  if (/EdgiOS/i.test(ua)) return "edge_ios";
  if (/OPiOS/i.test(ua)) return "opera_ios";
  if (/DuckDuckGo/i.test(ua)) return "duckduckgo_ios";
  if (/Brave/i.test(ua)) return "brave_ios";

  if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "safari";

  return "other";
}

3. Scroll down and tap Safari Websites
4. Choose "While Using the App"
Then return to this page and try again.`;
      break;
    case "chrome_ios":
      message = `Location could not be accessed.
To enable location on iPhone:
1. Open Settings

3. Scroll down and tap Chrome
4. Choose "While Using the App"
Then return to this page and try again.`;
      break;
    case "google_app":
      message = `Location could not be accessed.
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Google
4. Choose "While Using the App"
Then return to this page and try again.`;
      break;
    case "firefox_ios":
      message = `Location could not be accessed.
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Firefox
4. Choose "While Using the App"

      break;
    case "edge_ios":

To enable location on iPhone:

2. Tap Privacy & Security → Location Services

To enable location on iPhone:

<script>
/* ===============================
   MAP SETUP
================================*/
let map = L.map('map').setView([-6.200, 106.816], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

const vendorIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/3448/3448337.png",
  iconSize: [40, 40]
});

let vendorMarker = null;
let watchID = null;

/* ===============================
   SHARE LOCATION
================================*/
document.getElementById("shareBtn").onclick = () => {
  if (!navigator.geolocation) return alert("Geolocation tidak tersedia");

  // cek iOS dulu
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    showiOSLocationHelp();
  }

  watchID = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    db.ref("vendors/" + uid).update({
      lat: lat,
      lng: lng
    });

    if (vendorMarker) {
      vendorMarker.setLatLng([lat, lng]);
    } else {
      vendorMarker = L.marker([lat, lng], {icon: vendorIcon}).addTo(map);
    }

  }, err => alert(err.message));
};

document.getElementById("stopBtn").onclick = () => {
  if (watchID) navigator.geolocation.clearWatch(watchID);
  watchID = null;
};

/* ===============================
   UPDATE PROFIL
================================*/
function updateProfil() {
  const status = document.getElementById("status").value;
  const jamBuka = document.getElementById("jamBuka").value;
  const jamTutup = document.getElementById("jamTutup").value;
  const menuList = document.getElementById("menu").value.split(",").map(s => s.trim());
  const gambar = document.getElementById("gambar").value;

  db.ref("vendors/" + uid).update({
    status,
    jamBuka,
    jamTutup,
    menu: menuList,
    gambar
  });

  alert("Profil berhasil diupdate!");
}

/* ===============================
   LOAD SEMUA VENDOR ke MAP
================================*/
function loadVendorsOnMap() {
  db.ref("vendors").on("value", snap => {
    const data = snap.val();
    if (!data) return;

    Object.keys(data).forEach(id => {
      const v = data[id];
      if (!v.lat || !v.lng) return;

      const marker = L.marker([v.lat, v.lng], {icon: vendorIcon}).addTo(map);

      marker.bindPopup(`
        <b>${id}</b><br>
        Status: ${v.status || "-"}<br>
        Jam: ${v.jamBuka || "-"} - ${v.jamTutup || "-"}<br>
        Menu: ${(v.menu || []).join(", ")}<br>
        <img src="${v.gambar || ""}" width="120">
      `);
    });
  });
}
</script>

</body>
</html>
