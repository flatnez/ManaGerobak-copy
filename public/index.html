<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerobak Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 6px;
      padding: 6px 10px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topbar">
    <div id="role"></div>
    <div id="status">Not sharing</div>
    <div id="controls"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || "customer";
    let vendorId = params.get("vendorId");
    const socket = io();

    document.getElementById("role").innerText = "Role: " + role;

    const map = L.map("map").setView([-6.2, 106.8166], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    let watchId = null;
    let myMarker = null;
    const vendorMarkers = new Map();

    const vendorIcon = L.icon({
      iconUrl: "https://cdn-icons-png.flaticon.com/512/3075/3075977.png",
      iconSize: [32, 32],
      iconAnchor: [16, 32]
    });

    /* ===============================
       VENDOR MODE
    =============================== */
    if (role === "vendor") {
      if (!vendorId) {
        vendorId = prompt("Enter your Vendor ID:", "gerobak1");
        if (!vendorId || vendorId.trim() === "") {
          vendorId = "vendor_" + Math.random().toString(36).slice(2, 8);
        }
      }

      const controlsDiv = document.getElementById("controls");
      const statusDiv = document.getElementById("status");

      function updateButton() {
        controlsDiv.innerHTML = "";
        const btn = document.createElement("button");
        if (watchId === null) {
          btn.textContent = "Start Sharing Location";
          btn.onclick = startSharing;
        } else {
          btn.textContent = "Stop Sharing Location";
          btn.onclick = stopSharing;
        }
        controlsDiv.appendChild(btn);
      }

      socket.emit("registerVendor", {
        vendorId,
        meta: { name: vendorId }
      });

      function startSharing() {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }

        if (watchId !== null) return;

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            statusDiv.innerText = "Sharing location";

            socket.emit("vendorLocationUpdate", {
              vendorId,
              lat: latitude,
              lng: longitude
            });

            if (!myMarker) {
              myMarker = L.marker([latitude, longitude], { icon: vendorIcon })
                .addTo(map)
                .bindPopup(`${vendorId} (You)`);
              map.setView([latitude, longitude], 16);
            } else {
              myMarker.setLatLng([latitude, longitude])
                      .setPopupContent(`${vendorId} (You)`);
            }
          },
          err => {
            alert("Location error: " + err.message);
          },
          { enableHighAccuracy: true }
        );

        updateButton(); // change to Stop Sharing Location
      }

      function stopSharing() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        statusDiv.innerText = "Stopped sharing";
        socket.emit("vendorStop", { vendorId });

        if (myMarker) {
          map.removeLayer(myMarker);
          myMarker = null;
        }

        updateButton(); // change to Start Sharing Location
      }

      // Initial button
      updateButton();
    }

    /* ===============================
       CUSTOMER MODE
    =============================== */
    else {
      const controlsDiv = document.getElementById("controls");
      const statusDiv = document.getElementById("status");

      // Show "See My Location" button
      const btn = document.createElement("button");
      btn.textContent = "See My Location";
      btn.onclick = shareLocation;
      controlsDiv.appendChild(btn);

      function shareLocation() {
        if (!navigator.geolocation) {
          alert("Geolocation not supported");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude } = pos.coords;
            statusDiv.innerText = "You";

            if (!myMarker) {
              myMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                color: "#007AFF",
                fillColor: "#007AFF",
                fillOpacity: 0.9
              }).addTo(map).bindPopup("You");
            } else {
              myMarker.setLatLng([latitude, longitude]);
            }

            map.setView([latitude, longitude], 16);
          },
          err => {
            alert("Location error: " + err.message);
          }
        );
      }

      socket.on("vendorPosition", data => {
        let marker = vendorMarkers.get(data.vendorId);
        if (!marker) {
          marker = L.marker([data.lat, data.lng], { icon: vendorIcon })
            .addTo(map)
            .bindPopup(data.vendorId);
          vendorMarkers.set(data.vendorId, marker);
        } else {
          marker.setLatLng([data.lat, data.lng])
                .setPopupContent(data.vendorId);
        }
      });

      socket.on("vendorGone", data => {
        const marker = vendorMarkers.get(data.vendorId);
        if (marker) {
          map.removeLayer(marker);
          vendorMarkers.delete(data.vendorId);
        }
      });
    }
  </script>
</body>
</html>
