\<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaGerobak</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  body { 
    font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;
    overflow-x: hidden; overflow-y: auto; 
  }

  /* HEADER */
  .header-container {
      background: #fff; padding: 10px 15px; 
      border-bottom: 1px solid #ccc;
      position: sticky; top: 0; z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex; justify-content: space-between; align-items: center;
  }
  .header-container h2 { margin: 0; font-size: 1.1rem; flex-grow: 1; }
  
  .header-actions { display: flex; gap: 8px; }

  .header-btn {
      border: none; padding: 8px 12px; border-radius: 6px; 
      font-size: 0.85rem; cursor: pointer; color: white;
      font-weight: bold; white-space: nowrap;
  }
  
  #myGerobakBtn { background: #4CAF50; display: none; }
  #logoutBtnHeader { background: #555; display: none; }

  #map { 
    height: 100vh; width: 100%; z-index: 1; 
    transition: height 0.4s ease-in-out;
  }
  
  /* PANEL STYLE */
  .panel { 
    background: #fff; padding: 20px;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    position: relative; width: 100%; box-sizing: border-box;
    display: none; padding-bottom: 80px; 
  }

  input, select, button, textarea { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;}
  button { cursor: pointer; font-weight: bold; border: none; color: white; transition: 0.2s; }
  button:active { transform: scale(0.98); }
  
  /* TOMBOL KONTROL */
  #shareBtn { background-color: #4CAF50; }
  #stopBtn { background-color: #f44336; }
  #updateBtn { background-color: #2196F3; margin-top: 10px; }
  #cancelEditBtn { background-color: #999; margin-top: 10px;}
  
  /* Posisi Tombol Edit Profil di Panel Publik */
  #editProfilBtn { 
      background-color: #FF9800; /* Warna Orange */
      margin-right: 8px; /* Jarak ke tombol tutup */
      display: none; /* Default sembunyi */
      width: auto; 
      padding: 8px 16px; 
      font-size: 0.9rem;
  }
  
  #customerLocBtn {
    position: fixed; bottom: 25px; right: 15px; z-index: 999;
    background-color: #007AFF; 
    width: auto; padding: 12px 20px; border-radius: 50px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    font-size: 14px; display: none; color: white; border: none;
  }

  .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.9em; font-weight: bold; color: white; }
  .status-buka { background-color: #2ecc71; }
  .status-tutup { background-color: #e74c3c; }

  /* DETAIL STYLING */
  .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .detail-img { 
      width: auto; max-width: 100%; height: auto; max-height: 250px;       
      display: block; margin: 0 auto 20px auto; border-radius: 8px; 
      object-fit: contain; background: #f9f9f9;
  }
  .close-btn { background: #eee; color: #333; width: auto; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; margin: 0; }
  .menu-list { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px dashed #ccc; line-height: 1.6; }

  /* UPLOAD FOTO */
  .image-preview-container { text-align: center; margin-bottom: 15px; }
  #previewGambar { width: 100%; height: 200px; object-fit: contain; border-radius: 8px; border: 2px dashed #ccc; display: block; margin-bottom: 10px; background: #eee;}
  input[type="file"] { border: none; padding: 0; }
</style>
</head>
<body>

<div class="header-container">
    <h2>ManaGerobak</h2>
    <div class="header-actions">
        <button id="myGerobakBtn" class="header-btn" onclick="showMyPublicProfile()">🏠 Gerobak Saya</button>
        <button id="logoutBtnHeader" class="header-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div id="mapContainer">
  <div id="map"></div>
  <button id="customerLocBtn" onclick="enableCustomerLocation()">📍 Lokasi Saya</button>
</div>

<div id="vendorEditPanel" class="panel" style="border-top: 5px solid #FF9800;">
  <h3>✏️ Edit Profil Gerobak</h3>
  
  <div style="background: #f0f8ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #cceeff;">
      <h4 style="margin:0 0 10px 0;">Status Lokasi</h4>
      <button id="shareBtn">📡 Mulai Bagikan Lokasi</button>
      <button id="stopBtn" style="display:none;">🛑 Berhenti Bagikan Lokasi</button>
  </div>
  
  <hr>

  <label>Foto Gerobak:</label>
  <div class="image-preview-container">
      <img id="previewGambar" src="https://via.placeholder.com/300x200?text=Belum+Ada+Foto">
      <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(this)">
  </div>

  <label>Nama:</label>
  <input id="namaGerobak" placeholder="Nama Gerobak">
  <label>Status:</label>
  <select id="status"><option value="buka">Buka</option><option value="tutup">Tutup</option></select>
  <label>Jam:</label>
  <div style="display: flex; gap: 10px;">
    <input id="jamBuka" placeholder="08:00">
    <input id="jamTutup" placeholder="17:00">
  </div>
  <label>Menu (pisahkan koma):</label>
  <textarea id="menu" rows="3" placeholder="Nasi Goreng, Mie Rebus..."></textarea>
  
  <button id="updateBtn" onclick="updateProfil()">💾 Simpan Profil</button>
  <button id="cancelEditBtn" onclick="cancelEdit()">Batal</button>
</div>

<div id="customerDetailPanel" class="panel" style="border-top: none;">
    <div class="detail-header">
        <h2 id="dNama" style="font-size: 1.2em; text-align: left; padding: 0;">Nama Gerobak</h2>
        
        <div style="display: flex; align-items: center;">
            <button id="editProfilBtn" onclick="openEditMode()">✏️ Edit Profil</button>
            <button class="close-btn" onclick="closeDetailView()">✕ Tutup</button>
        </div>
    </div>

    <img id="dGambar" class="detail-img" src="" onerror="this.style.display='none'">
    
    <div style="margin-bottom: 20px; font-size: 1.1em;">
        <span id="dStatus" class="status-badge">STATUS</span>
        <span style="margin: 0 10px; color:#ccc;">|</span>
        <span id="dJam" style="font-weight:bold; color: #555;">00:00 - 00:00</span>
    </div>
    <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">📋 Daftar Menu</h3>
    <div id="dMenu" class="menu-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let map;
let vendorMarkers = {};
let customerMarker = null;
let watchID = null;
let customerWatchID = null;
let currentUser = null;
let currentRole = null;
let selectedVendorId = null;
let currentImageBase64 = ""; 
let myCurrentLat = null; 
let myCurrentLng = null; 

const normalIcon = L.icon({
 iconUrl: "image/gerobak.png",
 iconSize: [42, 42], iconAnchor: [21, 42], popupAnchor: [0, -42]
});

const bigIcon = L.icon({
 iconUrl: "image/gerobak.png",
 iconSize: [58, 58], iconAnchor: [29, 58], popupAnchor: [0, -58]
});

// === 1. DETEKSI ROLE ===
const urlParams = new URLSearchParams(window.location.search);
currentRole = urlParams.get('role') || localStorage.getItem("role") || "customer"; 
localStorage.setItem("role", currentRole);

// === 2. SETUP AWAL BERDASARKAN ROLE ===
if (currentRole === 'customer') {
    document.getElementById("vendorEditPanel").style.display = "none";
    document.getElementById("myGerobakBtn").style.display = "none";
    document.getElementById("logoutBtnHeader").style.display = "none"; 
    document.getElementById("map").style.height = "100vh";
    document.getElementById("customerLocBtn").style.display = "block";
    
    // Auto-Login Customer
    auth.signInAnonymously().catch((error) => console.error("Gagal login anonim:", error));

} else if (currentRole === 'vendor') {
    // Vendor menunggu auth state
}

// === 3. LISTENER AUTHENTICATION ===
auth.onAuthStateChanged(user => {
  currentUser = user; 

  if (!user && currentRole === 'vendor') {
      window.location.href = "login.html";
      return;
  }
  
  if (user) {
      console.log("User terhubung. Role:", currentRole);
      initMap();

      if (currentRole === 'vendor') {
          document.getElementById("myGerobakBtn").style.display = "block";
          document.getElementById("logoutBtnHeader").style.display = "block";
          loadMyFormData(user.uid);
      }
  }
});

function logout() {
  if (confirm("Keluar dari akun Vendor?")) auth.signOut();
}

// === 4. LOGIKA PETA & DATA ===
function initMap() {
    if(map) return; 
    
    map = L.map('map', { zoomControl: false }).setView([-6.200, 106.816], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    
    map.createPane('customerPane');
    map.getPane('customerPane').style.zIndex = 650;
    
    loadVendorsOnMap(); 
}

// === LIVE LOCATION VENDOR ===
document.getElementById("shareBtn").onclick = () => {
  if (!navigator.geolocation) return alert("Browser tidak mendukung Geolocation");
  
  navigator.geolocation.getCurrentPosition(pos => {
      myCurrentLat = pos.coords.latitude;
      myCurrentLng = pos.coords.longitude;
      map.setView([myCurrentLat, myCurrentLng], 17);
  });

  document.getElementById("shareBtn").style.display = "none";
  document.getElementById("stopBtn").style.display = "block";
  
  watchID = navigator.geolocation.watchPosition(pos => {
    myCurrentLat = pos.coords.latitude; 
    myCurrentLng = pos.coords.longitude;

    if (currentUser) {
        db.ref("vendors/" + currentUser.uid).update({
          lat: pos.coords.latitude, 
          lng: pos.coords.longitude,
          isLive: true,
          lastUpdated: firebase.database.ServerValue.TIMESTAMP
        });
    }
  }, err => { 
      alert("Gagal mengakses GPS: " + err.message); 
      stopSharing(); 
  }, { enableHighAccuracy: true });
};

document.getElementById("stopBtn").onclick = stopSharing;

function stopSharing() {
  if (watchID) navigator.geolocation.clearWatch(watchID);
  watchID = null;
  if(currentUser) {
      db.ref("vendors/" + currentUser.uid).update({ isLive: false });
  }
  document.getElementById("shareBtn").style.display = "block";
  document.getElementById("stopBtn").style.display = "none";
  alert("Lokasi live dimatikan.");
}

// === MENAMPILKAN VENDOR DI PETA ===
function loadVendorsOnMap() {
  if(!map) return;
  
  db.ref("vendors").on("value", snap => {
    const data = snap.val();
    let activeVendorIds = [];
    
    if (data) {
        Object.keys(data).forEach(id => {
          const v = data[id];
          
          if (!v.lat || !v.lng || v.isLive !== true) return;
          
          activeVendorIds.push(id); 
          let lat = parseFloat(v.lat);
          let lng = parseFloat(v.lng);
          
          let displayName = v.nama || "Gerobak";
          
          if (currentUser && !currentUser.isAnonymous && id === currentUser.uid) {
             displayName += " (Anda)";
             myCurrentLat = lat;
             myCurrentLng = lng;
          }

          let currentIcon = (id === selectedVendorId) ? bigIcon : normalIcon;

          if (vendorMarkers[id]) {
            vendorMarkers[id].setLatLng([lat, lng]);
            vendorMarkers[id].setIcon(currentIcon);
            vendorMarkers[id].options.vendorData = v; 
            vendorMarkers[id].bindPopup(`<b>${displayName}</b>`);
          } else {
            const newMarker = L.marker([lat, lng], { icon: currentIcon, vendorData: v }).addTo(map);
            newMarker.bindPopup(`<b>${displayName}</b>`);
            newMarker.on('click', function(e) {
                highlightVendorIcon(id);
                showVendorDetail(this.options.vendorData, id);
                map.flyTo([lat, lng], 16, { animate: true, duration: 0.5 });
            });
            vendorMarkers[id] = newMarker;
          }
        });
    }
    
    Object.keys(vendorMarkers).forEach(existingId => {
        if (!activeVendorIds.includes(existingId)) {
            map.removeLayer(vendorMarkers[existingId]);
            delete vendorMarkers[existingId];
        }
    });
  });
}

function highlightVendorIcon(id) {
    selectedVendorId = id;
    Object.keys(vendorMarkers).forEach(k => vendorMarkers[k].setIcon(normalIcon));
    if (vendorMarkers[id]) vendorMarkers[id].setIcon(bigIcon);
}

// ============================================
// === PERBAIKAN FUNGSI: GEROBAK SAYA ===
// ============================================

function showMyPublicProfile() {
    // 1. Cek User
    if (!currentUser) return alert("Anda belum login!");
    if (currentUser.isAnonymous) return alert("Menu ini khusus Vendor.");

    // 2. Beri Feedback Visual (Loading)
    const btn = document.getElementById("myGerobakBtn");
    const originalText = btn.innerText;
    btn.innerText = "⏳ Memuat...";
    btn.disabled = true;

    // 3. Ambil Data
    db.ref("vendors/" + currentUser.uid).once("value")
    .then(snap => {
        const v = snap.val();
        
        // Kembalikan Tombol
        btn.innerText = originalText;
        btn.disabled = false;

        if (v) {
            // Data ada
            highlightVendorIcon(currentUser.uid);
            
            // Cek Koordinat (Penting! Jika belum live, map jangan dipaksa flyTo null)
            if (v.lat && v.lng) {
                if(map) map.flyTo([v.lat, v.lng], 16, { animate: true, duration: 0.5 });
            } else {
                console.log("Lokasi belum live, membuka profil saja.");
            }
            
            // Buka Panel
            showVendorDetail(v, currentUser.uid);
        } else {
            // Data kosong -> Buka Mode Edit
            alert("Profil belum diatur. Silakan isi data dulu.");
            openEditMode();
        }
    })
    .catch(err => {
        console.error("Error:", err);
        btn.innerText = originalText;
        btn.disabled = false;
        alert("Gagal memuat profil: " + err.message);
    });
}

function openEditMode() {
    if (!currentUser) return;
    loadMyFormData(currentUser.uid);

    document.getElementById("customerDetailPanel").style.display = "none"; 
    document.getElementById("vendorEditPanel").style.display = "block"; 
    document.getElementById("map").style.height = "50vh";
    
    // Resize map agar tidak abu-abu
    setTimeout(() => { if(map) map.invalidateSize(); }, 300);
}

function cancelEdit() {
    // Kembali ke profil publik
    showMyPublicProfile(); 
}

function updateProfil() {
  if (!currentUser || currentUser.isAnonymous) return;
  const updateBtn = document.getElementById("updateBtn");
  updateBtn.innerText = "Menyimpan..."; updateBtn.disabled = true;
  
  db.ref("vendors/" + currentUser.uid).update({
    nama: document.getElementById("namaGerobak").value,
    status: document.getElementById("status").value,
    jamBuka: document.getElementById("jamBuka").value,
    jamTutup: document.getElementById("jamTutup").value,
    menu: document.getElementById("menu").value.split(","),
    gambar: currentImageBase64
  }).then(() => {
      alert("Profil berhasil disimpan!");
      updateBtn.innerText = "💾 Simpan Profil"; updateBtn.disabled = false;
      showMyPublicProfile(); 
  }).catch(err => {
      alert("Gagal update: " + err.message);
      updateBtn.innerText = "💾 Simpan Profil"; updateBtn.disabled = false;
  });
}

// Helper: Muat Data ke Input Form
function loadMyFormData(uid) {
    db.ref("vendors/" + uid).once("value").then(snap => {
        const v = snap.val();
        if(v) {
            document.getElementById("namaGerobak").value = v.nama || "";
            document.getElementById("status").value = v.status || "buka";
            document.getElementById("jamBuka").value = v.jamBuka || "";
            document.getElementById("jamTutup").value = v.jamTutup || "";
            document.getElementById("menu").value = (v.menu || []).join(", ");
            if (v.gambar) {
                currentImageBase64 = v.gambar;
                document.getElementById("previewGambar").src = v.gambar;
            }
        }
    });
}

function showVendorDetail(v, vendorId) {
    document.getElementById("vendorEditPanel").style.display = "none";
    const panel = document.getElementById("customerDetailPanel");
    const mapDiv = document.getElementById("map");
    mapDiv.style.height = "50vh"; 
    
    document.getElementById("dNama").innerText = v.nama || "Tanpa Nama";
    
    const statusEl = document.getElementById("dStatus");
    if(v.status === 'buka') { statusEl.innerText = "BUKA"; statusEl.className = "status-badge status-buka"; } 
    else { statusEl.innerText = "TUTUP"; statusEl.className = "status-badge status-tutup"; }
    
    document.getElementById("dJam").innerText = `${v.jamBuka || "--"} - ${v.jamTutup || "--"}`;

    const imgEl = document.getElementById("dGambar");
    if (v.gambar) { imgEl.src = v.gambar; imgEl.style.display = "block"; } 
    else { imgEl.style.display = "none"; }

    const menuDiv = document.getElementById("dMenu");
    menuDiv.innerHTML = "";
    let menuItems = Array.isArray(v.menu) ? v.menu : (v.menu ? v.menu.split(",") : []);
    if (menuItems.length > 0 && menuItems[0] !== "") {
        menuItems.forEach(m => {
            const item = document.createElement("div");
            item.innerText = "• " + m.trim();
            item.style.padding = "6px 0"; item.style.borderBottom = "1px solid #eee";
            menuDiv.appendChild(item);
        });
    } else { menuDiv.innerText = "Belum ada info menu."; }
    
    const editBtn = document.getElementById("editProfilBtn");
    if (currentRole === 'vendor' && currentUser && !currentUser.isAnonymous && vendorId === currentUser.uid) {
        editBtn.style.display = "block"; 
    } else {
        editBtn.style.display = "none"; 
    }

    panel.style.display = "block";
    setTimeout(() => { if(map) map.invalidateSize(); }, 400); 
}

function closeDetailView() {
    document.getElementById("customerDetailPanel").style.display = "none";
    document.getElementById("map").style.height = "100vh";
    selectedVendorId = null; 
    Object.keys(vendorMarkers).forEach(k => vendorMarkers[k].setIcon(normalIcon));
    setTimeout(() => { if(map) map.invalidateSize(); }, 400);
}

function handleImageUpload(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxWidth = 500;
                let scale = 1;
                if (img.width > maxWidth) scale = maxWidth / img.width;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                currentImageBase64 = compressedDataUrl;
                document.getElementById('previewGambar').src = compressedDataUrl;
            }
        }
        reader.readAsDataURL(file);
    }
}

function enableCustomerLocation() {
  if (!navigator.geolocation) return alert("Geolocation Error");
  if (customerWatchID !== null) { 
     if(customerMarker) map.setView(customerMarker.getLatLng(), 17);
     return; 
  }
  const customerStyle = { radius: 10, color: "#fff", weight: 3, fillColor: "#007AFF", fillOpacity: 1, pane: 'customerPane' };
  customerWatchID = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    if (customerMarker) customerMarker.setLatLng([lat, lng]);
    else customerMarker = L.circleMarker([lat, lng], customerStyle).addTo(map);
    map.setView([lat, lng], 17);
  }, err => console.error(err), { enableHighAccuracy: true });
}
</script>
</body>
</html>
