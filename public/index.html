<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerobak Tracker</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 180px;
    }

    button {
      margin-top: 6px;
      padding: 6px 10px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topbar">
    <div id="role"></div>
    <div id="status">Not sharing</div>
    <div id="controls"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
  /* =========================================================
     iOS BROWSER DETECTION + LOCATION HELP POPUP
  ========================================================== */
  function detectIOSBrowser() {
    const ua = navigator.userAgent;

    if (/CriOS/i.test(ua)) return "chrome";
    if (/FxiOS/i.test(ua)) return "firefox";
    if (/EdgiOS/i.test(ua)) return "edge";
    if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "safari";

    return "other";
  }

  function showIOSLocationHelp() {
    const browser = detectIOSBrowser();

    let message = "";

    if (browser === "safari") {
      message = `iPhone detected - Safari:

1. Open Settings
2. Privacy & Security → Location Services
3. Safari Websites → Allow While Using App`;
    }
    else if (browser === "chrome") {
      message = `iPhone detected - Chrome:

1. Open Settings
2. Privacy & Security → Location Services
3. Chrome → Allow While Using App`;
    }
    else if (browser === "firefox") {
      message = `iPhone detected - Firefox:

1. Open Settings
2. Privacy & Security → Location Services
3. Firefox → Allow While Using App`;
    }
    else if (browser === "edge") {
      message = `iPhone detected - Edge:

1. Open Settings
2. Privacy & Security → Location Services
3. Microsoft Edge → Allow While Using App`;
    }
    else {
      message = `iPhone detected:

Please enable Location in:
Settings → Privacy & Security → Location Services`;
    }

    alert(message);
  }

  /* =========================================================
     BASIC SETUP
  ========================================================== */

  const params = new URLSearchParams(window.location.search);
  const role = params.get("role") || "customer";
  const vendorId =
    params.get("vendorId") || "vendor_" + Math.random().toString(36).slice(2, 8);

  const socket = io();

  document.getElementById("role").innerText = "Role: " + role;

  const map = L.map("map").setView([-6.2, 106.8166], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap",
  }).addTo(map);

  let watchId = null;
  let myMarker = null;
  const vendorMarkers = new Map();

  /* =========================================================
     ICONS
  ========================================================== */

  const vendorIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/3075/3075977.png",
    iconSize: [32, 32],
    iconAnchor: [16, 32],
  });

  const customerIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/535/535239.png",
    iconSize: [26, 26],
    iconAnchor: [13, 26],
  });

  /* =========================================================
     VENDOR MODE
  ========================================================== */

  if (role === "vendor") {
    document.getElementById("controls").innerHTML = `
      <div><strong>ID:</strong> ${vendorId}</div>
      <button id="start">Start sharing</button>
      <button id="stop">Stop sharing</button>
    `;

    socket.emit("registerVendor", {
      vendorId,
      meta: { name: "Gerobak " + vendorId.slice(-3) },
    });

    document.getElementById("start").onclick = () => {
      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      if (watchId !== null) return;

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const { latitude, longitude } = pos.coords;

          document.getElementById("status").innerText = "Sharing location";

          socket.emit("vendorLocationUpdate", {
            vendorId,
            lat: latitude,
            lng: longitude,
          });

          if (!myMarker) {
            myMarker = L.marker([latitude, longitude], {
              icon: vendorIcon,
            })
              .addTo(map)
              .bindPopup("My Gerobak");
            map.setView([latitude, longitude], 16);
          } else {
            myMarker.setLatLng([latitude, longitude]);
          }
        },
        err => {
          if (err.code === 1) showIOSLocationHelp();
          else alert("Location error: " + err.message);
        },
        { enableHighAccuracy: true }
      );
    };

    document.getElementById("stop").onclick = () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      document.getElementById("status").innerText = "Stopped sharing";

      socket.emit("vendorStop", { vendorId });

      if (myMarker) {
        map.removeLayer(myMarker);
        myMarker = null;
      }
    };
  }

  /* =========================================================
     CUSTOMER MODE
  ========================================================== */

  else {
    document.getElementById("controls").innerHTML = `
      <button id="share">Share my location</button>
    `;

    document.getElementById("share").onclick = () => {
      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;

          document.getElementById("status").innerText = "You are here";

          if (!myMarker) {
            myMarker = L.marker([latitude, longitude], {
              icon: customerIcon
            })
              .addTo(map)
              .bindPopup("You (Customer)");
          } else {
            myMarker.setLatLng([latitude, longitude]);
          }

          map.setView([latitude, longitude], 16);
        },
        err => {
          if (err.code === 1) showIOSLocationHelp();
          else alert("Location error: " + err.message);
        }
      );
    };

    socket.on("vendorPosition", data => {
      let marker = vendorMarkers.get(data.vendorId);

      if (!marker) {
        marker = L.marker([data.lat, data.lng], {
          icon: vendorIcon,
        })
          .addTo(map)
          .bindPopup(data.meta?.name || data.vendorId);

        vendorMarkers.set(data.vendorId, marker);
      } else {
        marker.setLatLng([data.lat, data.lng]);
      }
    });

    socket.on("vendorGone", data => {
      const marker = vendorMarkers.get(data.vendorId);
      if (marker) {
        map.removeLayer(marker);
        vendorMarkers.delete(data.vendorId);
      }
    });
  }
  </script>
</body>
</html>
