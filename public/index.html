// Hitung Jarak (Haversine Formula) dalam KM
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Radius bumi km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; 
}

function handleSearch() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const resultsDiv = document.getElementById("searchResults");
    resultsDiv.innerHTML = "";

    // Ambil semua ID marker yang aktif
    let activeVendors = [];
    Object.keys(vendorMarkers).forEach(id => {
        const marker = vendorMarkers[id];
        const vData = marker.options.vendorData;
        
        // Filter nama
        const name = (vData.nama || "Gerobak").toLowerCase();
        
        if (query === "" || name.includes(query)) {
            // Hitung jarak dari user
            const vLat = parseFloat(vData.lat);
            const vLng = parseFloat(vData.lng);
            const dist = getDistance(userCurrentLat, userCurrentLng, vLat, vLng);
            
            activeVendors.push({
                id: id,
                data: vData,
                dist: dist
            });
        }
    });

    // Urutkan berdasarkan jarak terdekat
    activeVendors.sort((a, b) => a.dist - b.dist);

    if (activeVendors.length === 0) {
        // GUNAKAN t()
        resultsDiv.innerHTML = `<div style='padding:20px; text-align:center; color:#777;'>${t('msg_no_result')}</div>`;
        return;
    }

    // Tampilkan hasil
    activeVendors.forEach(item => {
        const div = document.createElement("div");
        div.className = "search-item";
        div.onclick = function() {
            selectSearchedVendor(item.id, item.data);
        };
        
    // GUNAKAN t() untuk satuan jarak
        const distText = item.dist < 1 
            ? (item.dist * 1000).toFixed(0) + t('dist_meter') 
            : item.dist.toFixed(1) + t('dist_km');
        
        const statusText = (item.data.status === 'keliling') ? t('status_keliling_search') : t('status_mangkal_search');

        div.innerHTML = `
            <div class="item-info">
                <b>${item.data.nama || "Gerobak"}</b>
                <span style="font-size:0.8rem; color:#666;">${statusText}</span> </div>
            <div class="item-dist">📍 ${distText}</div>
        `;
        resultsDiv.appendChild(div);
    });
}

    const lat = parseFloat(vData.lat);

function startSharingLocation() {
    if (!navigator.geolocation) return alert("Browser tidak mendukung Geolocation");
    if (!currentUser) return;

    document.getElementById("btnStartShare").innerText = "⏳...";
    
    navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        
        // Update global user pos
        userCurrentLat = lat;
        userCurrentLng = lng;
        
        map.setView([lat, lng], 17);
        
        watchID = navigator.geolocation.watchPosition(updatePositionToDB, handleError, { enableHighAccuracy: true });
        
        resetLocationButtons(true);
        isSharingLocally = true;

    }, handleError);
}

function updatePositionToDB(pos) {
    if (!currentUser) return;
    
    userCurrentLat = pos.coords.latitude;
    userCurrentLng = pos.coords.longitude;

    const updates = {
        lat: pos.coords.latitude, 
        lng: pos.coords.longitude,
        isLive: true,
        lastUpdated: firebase.database.ServerValue.TIMESTAMP
    };

    const vendorRef = db.ref("vendors/" + currentUser.uid);
    vendorRef.update(updates);
    vendorRef.onDisconnect().update({ isLive: false });
}

function stopSharingLocation() {
    if (watchID) navigator.geolocation.clearWatch(watchID);
    watchID = null;
    isSharingLocally = false;
    
    if(currentUser) {
        db.ref("vendors/" + currentUser.uid).update({ isLive: false });
        db.ref("vendors/" + currentUser.uid).onDisconnect().cancel();
    }

    resetLocationButtons(false);
    alert("Berhenti membagikan lokasi.");
}

function handleError(err) {
    // Cek apakah device adalah iPhone/iPad/iPod
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    // Error code 1 = PERMISSION_DENIED (User menolak / Browser memblokir)
    if (err.code === 1 && isIOS) {
        showiOSLocationHelp(); // <--- Panggil fungsi custom Anda di sini
    } else {
        // Error standar untuk Android atau error selain permission denied
        alert("Gagal mengakses GPS: " + err.message);
    }
    
    stopSharingLocation();
}

function resetLocationButtons(isLive) {
    const btnStart = document.getElementById("btnStartShare");
    const btnStop = document.getElementById("btnStopShare");
    
    if (isLive) {
        btnStart.style.display = "none";
        btnStop.style.display = "flex"; 
    } else {
        btnStart.innerHTML = '<img src="image/btn-live.png" alt="Mulai Live">';
        btnStart.style.display = "flex"; 
        btnStop.style.display = "none";
    }
}

function loadVendorsOnMap() {
  if(!map) return;
  
  db.ref("vendors").on("value", snap => {
    const data = snap.val();
    let activeVendorIds = [];
    
    if (data) {
        Object.keys(data).forEach(id => {
          const v = data[id];
          
          if (!v.lat || !v.lng || v.isLive !== true) return;
          
          activeVendorIds.push(id); 
          let lat = parseFloat(v.lat);
          let lng = parseFloat(v.lng);
          
          let displayName = v.nama || "Gerobak";
          if (currentUser && !currentUser.isAnonymous && id === currentUser.uid) {
             displayName += " (Anda)";
          }

          let currentIcon = (id === selectedVendorId) ? bigIcon : normalIcon;

          if (vendorMarkers[id]) {
            vendorMarkers[id].setLatLng([lat, lng]);
            vendorMarkers[id].setIcon(currentIcon);
            vendorMarkers[id].options.vendorData = v; 
            
            vendorMarkers[id].bindPopup(`<b>${displayName}</b>`);
            
            if (id === selectedVendorId) {
                vendorMarkers[id].openPopup();
                if (document.getElementById("customerDetailPanel").style.display === "block") {
                    showVendorDetail(v, id);
                }
            }

          } else {
            const newMarker = L.marker([lat, lng], { icon: currentIcon, vendorData: v }).addTo(map);
            newMarker.bindPopup(`<b>${displayName}</b>`);
            newMarker.on('click', function(e) {
                highlightVendorIcon(id);
                showVendorDetail(this.options.vendorData, id);
                map.flyTo([lat, lng], 16, { animate: true, duration: 0.5 });
            });
            vendorMarkers[id] = newMarker;
          }
        });
    }
    
    Object.keys(vendorMarkers).forEach(existingId => {
        if (!activeVendorIds.includes(existingId)) {
            map.removeLayer(vendorMarkers[existingId]);
            delete vendorMarkers[existingId];
            if (existingId === selectedVendorId) {
                closeDetailView();
                alert("Gerobak ini baru saja offline/tutup.");
            }
        }
    });
  });
}

function highlightVendorIcon(id) {
    selectedVendorId = id;
    Object.keys(vendorMarkers).forEach(k => vendorMarkers[k].setIcon(normalIcon));
    
    if (vendorMarkers[id]) {
        vendorMarkers[id].setIcon(bigIcon);
        vendorMarkers[id].openPopup();
    }
}

            highlightVendorIcon(currentUser.uid); 
            if (v.isLive === true && v.lat && v.lng) {
                if(map) map.flyTo([v.lat, v.lng], 16, { animate: true, duration: 0.5 });
            }

function updateProfil() {

function loadMyFormData(uid) {
    db.ref("vendors/" + uid).once("value").then(snap => {
        const v = snap.val();
        if(v) {
            document.getElementById("namaGerobak").value = v.nama || "";
            
            let currentStatus = v.status || "mangkal";
            if (currentStatus === "buka") currentStatus = "mangkal";
            if (currentStatus === "tutup") currentStatus = "mangkal"; 
            document.getElementById("status").value = currentStatus;
            
            let rawMenuStr = JSON.stringify(v.menu || "");
            let isNewAccount = rawMenuStr.includes("Contoh Menu");

            if (isNewAccount) {
                document.getElementById("jamBuka").value = "";
                document.getElementById("jamTutup").value = "";
                document.getElementById("pengumumanInput").value = "";
                document.getElementById("menu").value = ""; 
                
                currentImageBase64 = "";
                document.getElementById("previewGambar").style.display = "none";
                document.getElementById("hapusFotoBtn").style.display = "none";
            } else {
                document.getElementById("jamBuka").value = v.jamBuka || "";
                document.getElementById("jamTutup").value = v.jamTutup || "";
                document.getElementById("pengumumanInput").value = v.pengumuman || ""; 
                
                let cleanMenu = [];
                if (Array.isArray(v.menu)) {
                    cleanMenu = v.menu;
                } else if (v.menu) {
                    cleanMenu = v.menu.replace(/,/g, "\n").split("\n");
                }
                document.getElementById("menu").value = cleanMenu.join("\n");

                if (v.gambar && v.gambar !== "") {
                    currentImageBase64 = v.gambar;
                    document.getElementById("previewGambar").src = v.gambar;
                    document.getElementById("previewGambar").style.display = "block";
                    document.getElementById("hapusFotoBtn").style.display = "inline-block";
                } else {
                    currentImageBase64 = "";
                    document.getElementById("previewGambar").style.display = "none";
                    document.getElementById("hapusFotoBtn").style.display = "none";
                }
            }
        }
    });
}

function showVendorDetail(v, vendorId) {
    document.body.style.overflowY = "auto";
    document.getElementById("vendorEditPanel").style.display = "none";
    const panel = document.getElementById("customerDetailPanel");
    const mapDiv = document.getElementById("map");
    mapDiv.style.height = "50vh"; 
    
    document.getElementById("dNama").innerText = v.nama || "Tanpa Nama";
    
    const statusEl = document.getElementById("dStatus");
    let displayStatus = v.status || 'mangkal';
    if(displayStatus === 'buka') displayStatus = 'mangkal';
    
    if(displayStatus === 'keliling') { 
        statusEl.innerText = t('status_keliling'); // GUNAKAN t()
        statusEl.className = "status-badge status-keliling"; 
    } else { 
        statusEl.innerText = t('status_mangkal'); // GUNAKAN t()
        statusEl.className = "status-badge status-mangkal"; 
    }
    
    let rawMenuStr = JSON.stringify(v.menu || "");
    let isNewAccount = rawMenuStr.includes("Contoh Menu");

    const jamEl = document.getElementById("dJam");
    const sepJam = document.getElementById("sepJam");
    
    if (!isNewAccount && v.jamBuka && v.jamTutup) {
        jamEl.innerText = `${v.jamBuka} - ${v.jamTutup}`;
        jamEl.style.display = "inline"; 
        sepJam.style.display = "inline";
    } else {
        jamEl.style.display = "none"; 
        sepJam.style.display = "none";
    }

    const pengumumanBox = document.getElementById("dPengumumanBox");
    const pengumumanText = document.getElementById("dPengumumanText");

    if (v.pengumuman && v.pengumuman.trim() !== "") {
        pengumumanBox.style.display = "block";
        
        // Tampilkan teks asli (ID) atau status loading jika EN
        if (currentLang === "en") {
            pengumumanText.innerText = "Translating..."; // Indikator loading
            
            // Panggil API terjemahan
            translateDynamicText(v.pengumuman, "en").then(translatedText => {
                pengumumanText.innerText = translatedText;
            });
        } else {
            pengumumanText.innerText = v.pengumuman;
        }
    } else {
        pengumumanBox.style.display = "none";
    }

    const imgEl = document.getElementById("dGambar");
    if (v.gambar && v.gambar !== "") { 
        imgEl.src = v.gambar; 
        imgEl.style.display = "block"; 
    } else { 
        imgEl.style.display = "none"; 
    }

const menuDiv = document.getElementById("dMenu");
    menuDiv.innerHTML = "";
    
    let menuItems = [];
    if (Array.isArray(v.menu)) {
        menuItems = v.menu;
    } else if (typeof v.menu === 'string') {
        // Memisahkan berdasarkan koma atau enter (baris baru)
        menuItems = v.menu.split(/,|\n/); 
    }

    // Membersihkan item yang kosong atau berisi teks contoh
    const validMenu = menuItems.filter(m => m.trim() !== "" && !m.includes("Contoh Menu"));

    if (validMenu.length > 0) {
        if (currentLang === "en") {
            // 1. Tampilkan teks loading sementara API bekerja
            menuDiv.innerHTML = "<div style='padding:6px 0; color:#888;'><em>Translating menu...</em></div>";
            
            // 2. Gabungkan array menjadi satu string dengan pemisah baris baru (\n) agar hemat panggilan API
            const textToTranslate = validMenu.join("\n");

            translateDynamicText(textToTranslate, "en").then(translatedText => {
                menuDiv.innerHTML = ""; // Bersihkan teks loading
                
                // 3. Pecah kembali teks yang sudah diterjemahkan menjadi array
                const translatedItems = translatedText.split("\n");
                
                translatedItems.forEach(m => {
                    if (m.trim() !== "") { // Pastikan tidak membuat elemen kosong
                        const item = document.createElement("div");
                        item.innerText = "• " + m.trim();
                        item.style.padding = "6px 0"; 
                        item.style.borderBottom = "1px solid #00491a";
                        menuDiv.appendChild(item);
                    }
                });
            }).catch(err => {
                console.error("Gagal translate menu:", err);
                renderOriginalMenu(validMenu, menuDiv); // Fallback ke teks asli jika API error
            });

        } else {
            // Jika bahasa Indonesia (ID), langsung render teks asli
            renderOriginalMenu(validMenu, menuDiv);
        }
    } else {
        // Jika tidak ada menu sama sekali
        menuDiv.innerHTML = `<div style='padding:6px 0; color:#888;'><em>${currentLang === "en" ? "No menu available" : "Belum ada menu"}</em></div>`;
    }

    // === Fungsi Bantuan (Helper) agar kode tidak berulang ===
    function renderOriginalMenu(items, container) {
        container.innerHTML = "";
        items.forEach(m => {
            const item = document.createElement("div");
            item.innerText = "• " + m.trim();
            item.style.padding = "6px 0"; 
            item.style.borderBottom = "1px solid #00491a";
            container.appendChild(item);
        });
    }
    
    const editBtn = document.getElementById("editProfilBtn");
    if (currentRole === 'vendor' && currentUser && !currentUser.isAnonymous && vendorId === currentUser.uid) {
        editBtn.style.display = "block"; 
    } else {
        editBtn.style.display = "none"; 
    }

    panel.style.display = "block";
    
    setTimeout(() => { if(map) map.invalidateSize(); }, 400); 
}

function handleImageUpload(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxWidth = 500;
                let scale = 1;
                if (img.width > maxWidth) scale = maxWidth / img.width;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                currentImageBase64 = compressedDataUrl;
                
                const preview = document.getElementById('previewGambar');
                preview.src = compressedDataUrl;
                preview.style.display = "block";
                document.getElementById('hapusFotoBtn').style.display = "inline-block";
            }
        }
        reader.readAsDataURL(file);
    }
}

function enableCustomerLocation() {
  if (!navigator.geolocation) return alert("Geolocation Error");
  
  if (customerWatchID !== null) { 
     if(customerMarker) map.setView(customerMarker.getLatLng(), 17);
     return; 
  }

  const customerStyle = { radius: 10, color: "#fff", weight: 3, fillColor: "#007AFF", fillOpacity: 1, pane: 'customerPane' };
  
  document.getElementById("customerLocBtn").innerText = "⏳...";

  customerWatchID = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    
    // Update global var agar search feature lebih akurat
    userCurrentLat = lat;
    userCurrentLng = lng;

    if (customerMarker) {
        customerMarker.setLatLng([lat, lng]);
    } else {
        customerMarker = L.circleMarker([lat, lng], customerStyle).addTo(map);
        map.setView([lat, lng], 17);
        document.getElementById("customerLocBtn").innerText = "📍 Lokasi Saya";
    }
  }, err => {
      console.error(err);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (err.code === 1 && isIOS) {
          showiOSLocationHelp(); // Panggil popup bantuan
      } else {
          alert(t('msg_loc_denied'));
      }
      document.getElementById("customerLocBtn").innerText = "📍 Lokasi Saya";
  }, { enableHighAccuracy: true });
}

// Fungsi untuk menerjemahkan teks dinamis secara otomatis via API Gratis
async function translateDynamicText(text, targetLang) {
    // Jika teks kosong atau bahasa tujuannya adalah Indonesia (asli), kembalikan teks asli
    if (!text || targetLang === "id") return text; 

    try {
        // Menggunakan MyMemory Translation API (Gratis, limit ~500 kata/hari)
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=id|${targetLang}`);
        const data = await response.json();
        
        // Pastikan API mengembalikan hasil yang valid
        if (data && data.responseData && data.responseData.translatedText) {
            return data.responseData.translatedText;
        }
        return text; // Fallback jika gagal parsing
    } catch (error) {
        console.error("Gagal menerjemahkan teks:", error);
        return text; // Tampilkan teks bahasa Indonesia asli jika API error/offline
    }
}
