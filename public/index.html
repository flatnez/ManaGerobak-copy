<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerobak Map App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        #vendorIdInput {
            width: 140px;
            padding: 5px;
        }

        .label {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #444;
            text-align: center;
            transform: translate(-50%, -25px);
            font-size: 12px;
        }
    </style>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
</head>
<body>

<div id="controls"></div>
<div id="map"></div>

<script>
// ---------------------------------------------------
// CONFIG
// ---------------------------------------------------
const API_BASE = "https://mygerobak-production.up.railway.app";
let map, userMarker, vendorMarker, watchId;
let sharing = false;
let role, vendorId;


// ---------------------------------------------------
// INIT MAP
// ---------------------------------------------------
function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: -6.2, lng: 106.8 },
        zoom: 13,
    });

    determineRole();
}

// ---------------------------------------------------
// ROLE HANDLING
// ---------------------------------------------------
function determineRole() {
    const urlParams = new URLSearchParams(window.location.search);
    role = urlParams.get("role");

    if (role === "vendor") {
        buildVendorUI();
    } else {
        role = "customer";
        buildCustomerUI();
    }
}

// ---------------------------------------------------
// VENDOR UI
// ---------------------------------------------------
function buildVendorUI() {
    const controls = document.getElementById("controls");
    controls.innerHTML = `
        <input id="vendorIdInput" placeholder="Enter Vendor ID" />
        <button id="vendorContinueBtn">Continue</button>
        <br><br>
        <button id="toggleShareBtn" style="width:180px; display:none;"></button>
    `;

    document.getElementById("vendorContinueBtn").onclick = () => {
        vendorId = document.getElementById("vendorIdInput").value.trim();
        if (!vendorId) { alert("Vendor ID required"); return; }

        document.getElementById("vendorContinueBtn").style.display = "none";
        document.getElementById("vendorIdInput").style.display = "none";

        loadVendorButtonState();
    };
}

// Fetch current vendor sharing state
async function loadVendorButtonState() {
    updateVendorButton();
    document.getElementById("toggleShareBtn").style.display = "block";
}

function updateVendorButton() {
    const btn = document.getElementById("toggleShareBtn");

    if (sharing) {
        btn.textContent = "Stop sharing location";
        btn.onclick = stopVendorSharing;
    } else {
        btn.textContent = "Start sharing location";
        btn.onclick = startVendorSharing;
    }
}

// START sharing
function startVendorSharing() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    sharing = true;
    updateVendorButton();

    watchId = navigator.geolocation.watchPosition(
        async pos => {
            const data = {
                vendorId,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
            };

            await fetch(`${API_BASE}/updateVendorLocation`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            placeVendorMarker(pos.coords.latitude, pos.coords.longitude, true);
        },
        err => alert("Location error: " + err.message),
        { enableHighAccuracy: true }
    );
}

// STOP sharing
async function stopVendorSharing() {
    sharing = false;
    updateVendorButton();

    navigator.geolocation.clearWatch(watchId);

    await fetch(`${API_BASE}/stopVendor`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vendorId })
    });

    if (vendorMarker) vendorMarker.setMap(null);
}

// Place vendor marker
function placeVendorMarker(lat, lng, isSelf = false) {
    if (vendorMarker) vendorMarker.setMap(null);

    vendorMarker = new google.maps.Marker({
        position: { lat, lng },
        map,
    });

    const label = new google.maps.InfoWindow({
        content: `<div class="label">${vendorId}${isSelf ? " (you)" : ""}</div>`
    });

    vendorMarker.addListener("click", () => label.open(map, vendorMarker));
}



// ---------------------------------------------------
// CUSTOMER UI
// ---------------------------------------------------
function buildCustomerUI() {
    const controls = document.getElementById("controls");
    controls.innerHTML = `
        <button id="seeMyLocationBtn">See my location</button>
    `;

    document.getElementById("seeMyLocationBtn").onclick = shareCustomerLocation;

    startVendorPolling();
}

// CUSTOMER location button
function shareCustomerLocation() {
    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            placeCustomerMarker(pos.coords.latitude, pos.coords.longitude);
            map.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        err => alert("Location error: " + err.message),
        { enableHighAccuracy: true }
    );
}

// Customer marker
function placeCustomerMarker(lat, lng) {
    if (userMarker) userMarker.setMap(null);

    userMarker = new google.maps.Marker({
        position: { lat, lng },
        map,
    });

    const label = new google.maps.InfoWindow({
        content: `<div class="label" style="text-align:center;">You</div>`
    });

    label.open(map, userMarker);
}



// ---------------------------------------------------
// CUSTOMER FETCH VENDOR LOCATIONS
// ---------------------------------------------------
function startVendorPolling() {
    setInterval(async () => {
        const res = await fetch(`${API_BASE}/vendors`);
        const vendors = await res.json();

        vendors.forEach(v => {
            placeVendorMarker(v.lat, v.lng, false);
        });

    }, 3000);
}


// ---------------------------------------------------
window.onload = initMap;
</script>

</body>
</html>
