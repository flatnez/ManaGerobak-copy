<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Gerobak</title>

<!-- Leaflet MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  html, body { height: 100%; margin:0; }
  #map { height: 80vh; width: 100%; }
  .panel { padding: 10px; background: #f8f8f8; border-radius: 6px; margin:10px; }
</style>
</head>
<body>

<h2>Map Gerobak</h2>
<div id="map"></div>

<!-- PANEL -->
<div id="controlsPanel" class="panel">
  <div id="statusDiv">Status: Tidak berbagi lokasi</div>
  <div id="controlsDiv"></div>
</div>

<!-- PROFIL GEROBAK -->
<div id="profilePanel" class="panel" style="display:none;">
  <h3>Profil Gerobak</h3>
  <div><b>ID:</b> <span id="profId"></span></div>
  <div><b>Status:</b> <span id="profStatus"></span></div>
  <div><b>Jam:</b> <span id="profJam"></span></div>
  <div><b>Menu:</b> <span id="profMenu"></span></div>
  <div><img id="profGambar" src="" style="width:150px;margin-top:10px;"></div>
  <button onclick="profilePanel.style.display='none'">Tutup Profil</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>

<!-- Socket.io -->
<script src="/socket.io/socket.io.js"></script>

<script>
/* ===============================
   FIREBASE INIT
================================*/
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ===============================
   MAP SETUP
================================*/
const map = L.map('map').setView([-6.2, 106.816], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

const vendorIcon = L.icon({ iconUrl: "image/kiosk.png", iconSize: [32,32], iconAnchor: [16,32] });
const customerIcon = L.icon({radius:8,color:"#007AFF",fillColor:"#007AFF",fillOpacity:0.9});

const socket = io();

/* ===============================
   UI ELEMENTS
================================*/
const controlsDiv = document.getElementById("controlsDiv");
const statusDiv = document.getElementById("statusDiv");
const profilePanel = document.getElementById("profilePanel");
const profId = document.getElementById("profId");
const profStatus = document.getElementById("profStatus");
const profJam = document.getElementById("profJam");
const profMenu = document.getElementById("profMenu");
const profGambar = document.getElementById("profGambar");

/* ===============================
   AUTH + ROLE
================================*/
const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "customer";
const vendorId = localStorage.getItem("vendorId");

if(role==="vendor" && !vendorId){
    window.location.href="login.html";
}

/* ===============================
   VENDOR / CUSTOMER LOGIC
================================*/
let myMarker = null;
let watchId = null;
const vendorMarkers = new Map();

/* ===============================================
        iOS Browser Detection + Location Help Popup
    =============================================== */

    function detectBrowser() {
      const ua = navigator.userAgent;

      if (/GSA/i.test(ua)) return "google_app";
      if (/CriOS/i.test(ua)) return "chrome_ios";
      if (/FxiOS/i.test(ua)) return "firefox_ios";
      if (/EdgiOS/i.test(ua)) return "edge_ios";
      if (/OPiOS/i.test(ua)) return "opera_ios";
      if (/DuckDuckGo/i.test(ua)) return "duckduckgo_ios";
      if (/Brave/i.test(ua)) return "brave_ios";

      if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) return "safari";

      return "other";
    }

    function showiOSLocationHelp() {
      const browser = detectBrowser();
      let message = "";

      switch (browser) {
        case "safari":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Safari Websites
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "chrome_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Chrome
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "google_app":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Google
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "firefox_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Firefox
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "edge_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Microsoft Edge
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "opera_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Opera
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "duckduckgo_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap DuckDuckGo
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        case "brave_ios":
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Scroll down and tap Brave
4. Choose "While Using the App"

Then return to this page and try again.`;
          break;

        default:
          message = `Location could not be accessed.
          
To enable location on iPhone:
1. Open Settings
2. Tap Privacy & Security → Location Services
3. Find your browser in the list
4. Set Location to "While Using the App"

Then return to this page and try again.`;
      }

      alert(message);
    }

/* =========================
   VENDOR
========================= */
if(role==="vendor"){

  // Toggle share lokasi
  const toggleBtn = document.createElement("button");
  toggleBtn.textContent="Mulai Berbagi Lokasi";
  toggleBtn.onclick = ()=>{ if(!watchId) startSharing(); else stopSharing(); };
  controlsDiv.appendChild(toggleBtn);

  function startSharing(){
    if(!navigator.geolocation) return alert("Geolocation not supported");
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) showiOSLocationHelp();

    watchId = navigator.geolocation.watchPosition(pos=>{
      const {latitude, longitude} = pos.coords;
      statusDiv.innerText="Berbagi lokasi";
      map.setView([latitude,longitude],16);

      // Kirim ke Firebase
      db.ref("vendors/"+vendorId).update({
        lat: latitude,
        lng: longitude
      });

      socket.emit("vendorLocationUpdate",{vendorId, lat:latitude, lng:longitude});

      // marker sendiri
      if(!myMarker) myMarker=L.marker([latitude,longitude],{icon:vendorIcon}).addTo(map).bindPopup(`${vendorId} (Anda)`);
      else myMarker.setLatLng([latitude,longitude]).setPopupContent(`${vendorId} (Anda)`);
    }, err=>alert(err.message), {enableHighAccuracy:true});

    toggleBtn.textContent="Berhenti Berbagi Lokasi";
  }

  function stopSharing(){
    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId=null;
    statusDiv.innerText="Tidak berbagi lokasi";
    socket.emit("vendorStop",{vendorId});
    if(myMarker){ map.removeLayer(myMarker); myMarker=null; }
    toggleBtn.textContent="Mulai Berbagi Lokasi";
  }

  // Lihat profil vendor lain
  function showProfile(vendorData){
    profId.innerText=vendorData.id;
    profStatus.innerText=vendorData.status || "-";
    profJam.innerText=(vendorData.jamBuka || "-")+" - "+(vendorData.jamTutup || "-");
    profMenu.innerText=(vendorData.menu || []).join(", ");
    profGambar.src=vendorData.gambar || "";
    profilePanel.style.display="block";
  }

}

/* =========================
   CUSTOMER
========================= */
else {
  const locBtn=document.createElement("button");
  locBtn.textContent="Tunjukkan Lokasi Saya";
  locBtn.onclick=()=>{navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    map.setView([latitude,longitude],16);
    if(!myMarker) myMarker=L.circleMarker([latitude,longitude],{radius:8,color:"#007AFF",fillColor:"#007AFF",fillOpacity:0.9}).addTo(map).bindPopup('Anda');
    else myMarker.setLatLng([latitude,longitude]);
  }, err=>alert(err.message));};
  controlsDiv.appendChild(locBtn);
}

/* =========================
   LOAD SEMUA VENDOR ke MAP
========================= */
function loadVendorsOnMap(){
  db.ref("vendors").on("value", snap=>{
    const data = snap.val();
    if(!data) return;

    Object.keys(data).forEach(id=>{
      const v = data[id];
      if(!v.lat || !v.lng) return;

      let marker = vendorMarkers.get(id);
      if(!marker){
        marker = L.marker([v.lat,v.lng],{icon:vendorIcon}).addTo(map);
        marker.on("click",()=>{ 
          profId.innerText=id;
          profStatus.innerText=v.status||"-";
          profJam.innerText=(v.jamBuka||"-")+" - "+(v.jamTutup||"-");
          profMenu.innerText=(v.menu||[]).join(", ");
          profGambar.src=v.gambar||"";
          profilePanel.style.display="block";
        });
        vendorMarkers.set(id,marker);
      } else {
        marker.setLatLng([v.lat,v.lng]);
      }
    });
  });
}

loadVendorsOnMap();
</script>

</body>
</html>
