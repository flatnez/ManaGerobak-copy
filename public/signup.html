<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Gerobak</title>
</head>
<body>
<h2>Daftar Gerobak Baru</h2>
<form id="signupForm">
    <input type="text" id="vendorId" placeholder="ID Gerobak" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Daftar</button>
</form>
<p>Sudah punya akun? <a href="login.html">Login</a></p>
<div id="msg"></div>

<script>
document.getElementById("signupForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const vendorId = document.getElementById("vendorId").value.trim();
    const password = document.getElementById("password").value.trim();
    const res = await fetch("/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vendorId,password})});
    const data = await res.json();
    const msg = document.getElementById("msg");
    if(data.success){ msg.innerText="Berhasil daftar!"; localStorage.setItem("vendorId",vendorId); window.location.href="index.html?role=vendor"; }
    else msg.innerText=data.message;
});
</script>
</body>
</html>
