<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vendor Signup</title>
</head>
<body>
  <h2>Signup</h2>
  <input id="vendorId" placeholder="Gerobak ID" /><br>
  <input id="password" type="password" placeholder="Password" /><br>
  <button onclick="signup()">Sign Up</button>
  <p>Already have an account? <a href="login.html">Login here</a></p>

  <script>
    async function signup() {
      const vendorId = document.getElementById("vendorId").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!vendorId || !password) return alert("Please fill both fields");

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vendorId, password })
      });

      const data = await res.json();
      if (data.success) {
        alert("Signup successful!");
        window.location.href = "/login.html";
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
