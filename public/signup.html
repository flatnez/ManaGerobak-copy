<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaGerobak - Signup</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input { display: block; margin: 10px 0; padding: 8px; width: 100%; max-width: 300px; }
button { padding: 8px 16px; }
</style>
</head>
<body>
<h2>Signup Vendor</h2>
<input id="vendorId" placeholder="Gerobak ID">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<p id="msg"></p>
<p>Already have an account? <a href="login.html">Login</a></p>

<script>
async function signup() {
  const vendorId = document.getElementById("vendorId").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  if (!vendorId || !password) { msg.innerText = "Please enter ID and password"; return; }

  const res = await fetch("/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vendorId, password })
  });
  const data = await res.json();
  if (data.success) {
    localStorage.setItem("gerobakId", vendorId);
    window.location.href = "index.html?role=vendor";
  } else msg.innerText = data.message;
}
</script>
</body>
</html>
