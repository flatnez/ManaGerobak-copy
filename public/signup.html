<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vendor Signup</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { display: block; margin: 10px 0; padding: 8px; width: 300px; }
  </style>
</head>
<body>
  <h2>Vendor Signup</h2>
  <input type="text" id="vendorId" placeholder="Gerobak ID">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <p id="msg"></p>
  <p>Already have an account? <a href="login.html">Login</a></p>

  <script>
    async function signup() {
      const vendorId = document.getElementById("vendorId").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!vendorId || !password) { msg.innerText = "Please fill both fields."; return; }

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vendorId, password })
      });
      const data = await res.json();
      if (data.success) {
        msg.innerText = "Account created! Redirecting to login...";
        setTimeout(() => location.href = "login.html", 1000);
      } else {
        msg.innerText = data.message;
      }
    }
  </script>
</body>
</html>
