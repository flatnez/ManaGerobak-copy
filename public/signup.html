<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Gerobak</title>
</head>
<body>
<h2>Daftar Gerobak Baru</h2>

<form onsubmit="signUp(event)">
    <input type="text" id="gerobakId" placeholder="Nama Gerobak (ID Gerobak)" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Daftar</button>
</form>

<p>Sudah punya akun? <a href="login.html">Login</a></p>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
    authDomain: "managerobak.firebaseapp.com",
    databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "managerobak",
    storageBucket: "managerobak.firebasestorage.app",
    messagingSenderId: "836881712482",
    appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// SIGN UP
function signUp(e) {
  e.preventDefault();

  const gerobakId = document.getElementById("gerobakId").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  auth.createUserWithEmailAndPassword(email, password)
    .then(res => {
      const uid = res.user.uid;

      // SIMPAN PROFIL AWAL DI DATABASE
      db.ref("vendors/" + uid).set({
        idGerobak: gerobakId,
        lat: 0,
        lng: 0,
        jamBuka: "",
        status: "tutup",
        menu: [],
        gambar: ""
      });

      alert("Pendaftaran berhasil!");
      window.location.href = "login.html";
    })
    .catch(err => alert(err.message));
}
</script>

</body>
</html>
