<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Gerobak</title>
<style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    h2 { margin-top: 0; color: #333; }
    
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    
    .password-container {
        position: relative;
        width: 100%;
        margin: 10px 0;
    }
    .password-container input {
        margin: 0;
        padding-right: 40px; 
    }
    .toggle-eye {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #777;
    }
    .toggle-eye svg {
        width: 20px;
        height: 20px;
    }

    button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #45a049; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .error-msg { color: red; font-size: 0.9em; margin-top: 10px; display: none; }
    a { text-decoration: none; color: #007AFF; }
    p { font-size: small; color: #666; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <h2>Daftar Gerobak Baru</h2>

    <form onsubmit="signUp(event)">
        <input type="text" id="gerobakId" placeholder="Nama Gerobak" required>
        <input type="email" id="email" placeholder="Email" required>
        
        <div class="password-container">
            <input type="password" id="password" placeholder="Password (Min. 6 karakter)" required>
            <span id="togglePassword" class="toggle-eye" onclick="togglePasswordVisibility()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
        </div>
        
        <button type="submit" id="regBtn">Daftar Sekarang</button>
    </form>

    <p id="errorText" class="error-msg"></p>

    <p>Sudah punya akun? <a href="login.html">Login disini</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// SVG ICONS
const iconEyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
const iconEyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

function togglePasswordVisibility() {
    const passwordInput = document.getElementById("password");
    const toggleIcon = document.getElementById("togglePassword");
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.innerHTML = iconEyeClosed; 
    } else {
        passwordInput.type = "password";
        toggleIcon.innerHTML = iconEyeOpen; 
    }
}

function signUp(e) {
  e.preventDefault(); 

  const gerobakId = document.getElementById("gerobakId").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const regBtn = document.getElementById("regBtn");
  const errorText = document.getElementById("errorText");

  errorText.style.display = "none"; errorText.innerText = "";

  if (password.length < 6) { showError("Password harus minimal 6 karakter."); return; }

  regBtn.innerText = "Mendaftarkan..."; regBtn.disabled = true;

  auth.createUserWithEmailAndPassword(email, password)
    .then(res => {
      const uid = res.user.uid;
      return db.ref("vendors/" + uid).set({
        idGerobak: gerobakId,
        nama: gerobakId, 
        email: email,
        lat: 0, lng: 0,
        jamBuka: "08:00", jamTutup: "17:00",
        status: "tutup",
        menu: ["Contoh Menu 1", "Contoh Menu 2"], 
        gambar: ""
      });
    })
    .then(() => {
        alert("Pendaftaran berhasil! Silakan Login.");
        window.location.href = "login.html";
    })
    .catch(err => {
        regBtn.innerText = "Daftar Sekarang"; regBtn.disabled = false;
        console.error(err);
        if (err.code === "auth/email-already-in-use") { showError("Email ini sudah terdaftar."); } 
        else if (err.code === "auth/invalid-email") { showError("Format email tidak valid."); } 
        else if (err.code === "auth/weak-password") { showError("Password terlalu lemah."); } 
        else { showError("Gagal daftar: " + err.message); }
    });
}

function showError(msg) {
    const errorText = document.getElementById("errorText");
    errorText.innerText = msg;
    errorText.style.display = "block";
}
</script>

</body>
</html>
