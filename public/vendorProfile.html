<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Gerobak</title>
</head>
<body>

<h2>Profil Gerobak</h2>

<label>Jam Buka: <input type="text" id="jamBuka"></label><br>
<label>Status:
  <select id="status">
    <option value="buka">Buka</option>
    <option value="tutup">Tutup</option>
  </select>
</label><br>
<label>Menu (pisahkan dengan koma): <input type="text" id="menu"></label><br>
<label>URL Foto Gerobak: <input type="text" id="gambar"></label><br>

<button onclick="saveProfile()">Simpan Profil</button>
<br><br>
<button onclick="window.location.href='index.html?role=vendor'">Kembali ke Map</button>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
    authDomain: "managerobak.firebaseapp.com",
    databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "managerobak",
    storageBucket: "managerobak.firebasestorage.app",
    messagingSenderId: "836881712482",
    appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const uid = localStorage.getItem("vendorUid");

// LOAD PROFIL
db.ref("vendors/" + uid).once("value", snap => {
  const v = snap.val();
  document.getElementById("jamBuka").value = v.jamBuka || "";
  document.getElementById("status").value = v.status || "tutup";
  document.getElementById("menu").value = (v.menu || []).join(", ");
  document.getElementById("gambar").value = v.gambar || "";
});

// SAVE PROFIL
function saveProfile() {
  const jamBuka = document.getElementById("jamBuka").value;
  const status = document.getElementById("status").value;
  const menu = document.getElementById("menu").value.split(",").map(x => x.trim());
  const gambar = document.getElementById("gambar").value;

  db.ref("vendors/" + uid).update({
    jamBuka, status, menu, gambar
  }).then(() => alert("Profil berhasil disimpan"));
}
</script>

</body>
</html>
