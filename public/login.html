<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vendor Login</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { display: block; margin: 10px 0; padding: 8px; width: 300px; }
  </style>
</head>
<body>
  <h2>Vendor Login</h2>
  <input type="text" id="vendorId" placeholder="Gerobak ID">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="msg"></p>
  <p>Don't have an account? <a href="signup.html">Sign Up</a></p>

  <script>
    async function login() {
      const vendorId = document.getElementById("vendorId").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!vendorId || !password) { msg.innerText = "Please fill both fields."; return; }

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vendorId, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem("vendorId", vendorId);
        location.href = "index.html?role=vendor";
      } else {
        msg.innerText = data.message;
      }
    }
  </script>
</body>
</html>
