<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Gerobak</title>
</head>
<body>
<h2>Login Gerobak</h2>
<form id="loginForm">
    <input type="text" id="vendorId" placeholder="ID Gerobak" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>
<p>Belum punya akun? <a href="signup.html">Daftar</a></p>
<div id="msg"></div>

<script>
document.getElementById("loginForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const vendorId = document.getElementById("vendorId").value.trim();
    const password = document.getElementById("password").value.trim();
    const res = await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vendorId,password})});
    const data = await res.json();
    const msg = document.getElementById("msg");
    if(data.success){ localStorage.setItem("vendorId",vendorId); window.location.href="index.html?role=vendor"; }
    else msg.innerText=data.message;
});
</script>
</body>
</html>
