<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Gerobak</title>
<style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #45a049; }
    .error-msg { color: red; font-size: 0.9em; margin-top: 10px; display: none; }
    a { text-decoration: none; color: #007AFF; }
</style>
</head>
<body>

<div class="container">
    <h2>Login Gerobak</h2>

    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <button id="loginBtn" onclick="login()">Login</button>
    
    <p id="errorText" class="error-msg"></p>

    <p style="font-size: small;">Belum punya akun? <a href="signup.html">Daftar</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
/* KONFIGURASI FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* FUNGSI LOGIN */
function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorText = document.getElementById("errorText");
  const loginBtn = document.getElementById("loginBtn");

  // Reset pesan error
  errorText.style.display = "none";
  errorText.innerText = "";

  if (!email || !password) {
      showError("Harap isi email dan password.");
      return;
  }

  // Ubah tombol jadi loading
  loginBtn.innerText = "Loading...";
  loginBtn.disabled = true;

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      const uid = userCredential.user.uid;
      
      // LOGIKA OTOMATIS: Cek apakah user ini terdaftar sebagai Vendor di Database?
      db.ref("vendors/" + uid).once("value").then(snapshot => {
          let role = "customer"; // Default jadi customer
          
          if (snapshot.exists()) {
              role = "vendor"; // Jika datanya ada di folder 'vendors', berarti dia vendor
          }

          // Simpan role & uid
          localStorage.setItem("vendorUid", uid);
          localStorage.setItem("role", role);

          // Redirect
          window.location.href = `index.html?role=${role}`;
      });
    })
    .catch((error) => {
      loginBtn.innerText = "Login";
      loginBtn.disabled = false;
      
      // PENANGANAN ERROR BAHASA INDONESIA
      console.error("Login Error:", error.code);
      
      if (error.code === "auth/user-not-found" || error.code === "auth/invalid-email") {
          showError("Email belum punya akun terregistrasi.");
      } else if (error.code === "auth/wrong-password") {
          showError("Email/password salah.");
      } else if (error.code === "auth/too-many-requests") {
          showError("Terlalu banyak percobaan gagal. Coba lagi nanti.");
      } else {
          showError("Terjadi kesalahan: " + error.message);
      }
    });
}

function showError(message) {
    const errorText = document.getElementById("errorText");
    errorText.innerText = message;
    errorText.style.display = "block";
}
</script>

</body>
</html>
