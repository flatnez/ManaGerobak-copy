<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Gerobak</title>
<style>
    /* --- RESET & BODY --- */
    body { 
        font-family: Arial, Helvetica, sans-serif; 
        margin: 0; 
        background-color: #356849; 
        display: flex; 
        flex-direction: column; 
        min-height: 100vh; 
    }
    /* --- HEADER --- */
    .header-logo {
        height: 25px;
        width: auto;
        object-fit: contain;
        margin-right: 15px;
    }
    
    .header-line {
        height: 7px;
    }

    .header-container {
        background: #356849; 
        padding: 10px 25px 10px 25px; 
        border-bottom: 1.5px solid #000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        position: sticky; top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        z-index: 9999;
    }

    /* --- HEADER ACTIONS --- */
    .header-actions { 
        display: flex; 
        gap: 8px; 
        align-items: center; 
        flex-shrink: 0;
    }
    .header-actions img {
        display: block;
    }

    .lang-dropdown-container {
        position: relative; 
        display: inline-block;
    }
    .image-btn {
        background: transparent !important; 
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center; 
        outline: none; 
    }
    
    .image-btn:hover, .image-btn:focus, .image-btn:active {
        background: transparent !important;
        background-color: transparent !important;
    }
    #imgLangBtn {
        height: 35px !important;
        width: auto !important;
        object-fit: contain !important;
        transition: transform 0.2s ease !important;
        display: block !important;
    }
    
    button.image-btn:active #imgLangBtn { 
        transform: scale(0.92) !important; 
    }
    .lang-dropdown-content {
        display: none;
        position: absolute;
        right: 0; 
        top: 100%; 
        background-color: #fff;
        min-width: 130px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 2000;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 5px;
        border: 1px solid #ddd;
    }
    .lang-dropdown-content div {
        color: #333;
        padding: 12px 15px;
        text-decoration: none;
        display: block;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: bold;
        transition: 0.2s;
    }
    .lang-dropdown-content div:hover {
        background-color: #f1f1f1;
    }
    .show-dropdown {
        display: block;
    }

    /* --- MAIN LAYOUT & CONTAINER --- */
    .main-wrapper { 
        flex: 1; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 20px; 
    }
    .container { 
        background: white;
        padding: 30px; 
        border-radius: 8px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        width: 300px; 
        max-width: 100%; 
        text-align: center; 
    }
    h2 { margin-top: 0; color: #333; }
    
    /* --- FORM INPUTS --- */
    input { 
        width: 100%; 
        padding: 10px; 
        margin: 10px 0; 
        box-sizing: border-box; 
        border: 1px solid #ccc; 
        border-radius: 4px; 
    }
    .password-container { 
        position: relative; 
        width: 100%; 
        margin: 10px 0; 
    }
    .password-container input { 
        margin: 0; 
        padding-right: 40px; 
    }
    .toggle-eye { 
        position: absolute; 
        right: 10px; 
        top: 50%; 
        transform: translateY(-50%); 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        color: #777; 
    }
    .toggle-eye svg {
        width: 20px;
        height: 20px;
    }
    
    /* --- BUTTONS --- */
    button { 
        width: 100%; 
        padding: 10px; 
        background-color: #4CAF50; 
        color: white; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: bold; 
        margin-top: 10px; 
    }
    button:hover { 
        background-color: #45a049; 
    }
    button:disabled { 
        background-color: #ccc; 
        cursor: not-allowed; 
    }
    
    /* --- MESSAGES & LINKS --- */
    .error-msg { 
        color: red; 
        font-size: 0.85em; 
        margin-top: 10px; 
        display: none; 
    }
    .success-msg { 
        color: #2e7d32; 
        font-size: 0.85em; 
        margin-top: 10px; 
        display: none; 
    }
    .link-text { 
        font-size: small; 
        color: #666; 
        margin-top: 15px; 
    }
    a { 
        text-decoration: none; 
        color: #007AFF; 
        cursor: pointer; 
    }

    /* --- RESPONSIVE MOBILE --- */
    @media (max-width: 1000px) {
        .header-container {
            flex-direction: column; 
            align-items: center;    
        }
        .header-logo {
            margin-right: 0;        
        }
        .header-line {
            height: 6.5px;
            margin: 6px 0 8px 0;
        }
        .header-actions {
            display: flex;
            flex-direction: row !important; 
            flex-wrap: wrap;                
            justify-content: center;
            align-items: center;            
            gap: 9px 8px;
            width: 100%;
        }
        
        .lang-dropdown-content {
            right: 50%;
            transform: translateX(50%);
        }
    }
</style>
</head>
<body>
<div class="header-container">
    <img src="image/managerobak_logo.png" alt="ManaGerobak" class="header-logo">
    <img src="image/header_line.png" alt="-" class="header-line">
    
    <div class="header-actions">
        <div id="langDropdownContainer" class="lang-dropdown-container">
            <button class="image-btn" onclick="toggleLangDropdown()">
                <img id="imgLangBtn" src="image/btn-id.png" alt="Bahasa">
            </button>
            <div id="langDropdown" class="lang-dropdown-content">
                <div onclick="setLanguage('id')">Indonesia</div>
                <div onclick="setLanguage('en')">English</div>
            </div>
        </div>
    </div>
</div>
<div class="main-wrapper">
    <div class="container">
        <h2 id="formTitle" data-i18n="title_login">Login Gerobak</h2>
        <input type="email" id="email" placeholder="Email" data-i18n-placeholder="ph_email" required>
        
        <div id="passwordArea">
            <div class="password-container">
                <input type="password" id="password" placeholder="Password" data-i18n-placeholder="ph_password" required>
                <span id="togglePassword" class="toggle-eye" onclick="togglePasswordVisibility()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </span>
            </div>
        </div>
        <button id="mainBtn" onclick="handleAuth()" data-i18n="btn_login">Login</button>
        
        <p id="errorText" class="error-msg"></p>
        <p id="successText" class="success-msg"></p>
        <div class="link-text">
            <span id="forgotPassLink">
                <span data-i18n="link_forgot">Lupa password?</span> 
                <a onclick="showForgotPassword()" data-i18n="link_click_here">Klik disini</a>
            </span>
            <span id="backToLoginLink" style="display:none;">
                <a onclick="showLogin()" data-i18n="link_back_login">Kembali ke Login</a>
            </span>
        </div>
        <p class="link-text" id="signUpLink">
            <span data-i18n="link_no_account">Belum punya akun?</span> 
            <a href="signup.html" data-i18n="link_register">Daftar</a>
        </p>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
let isForgotPasswordMode = false;

// SVG ICONS
const iconEyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
const iconEyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

/* ===============================================
        MULTI-LANGUAGE SUPPORT (LOGIN)
   =============================================== */
const translations = {
    id: {
        title_login: "Login Gerobak",
        title_reset: "Reset Password",
        ph_email: "Email",
        ph_password: "Password",
        btn_login: "Login",
        btn_loading: "Loading...",
        btn_reset: "Kirim Link Reset",
        btn_sending: "Mengirim...",
        err_empty: "Isi semua kolom.",
        err_invalid: "Email atau Password salah.",
        err_error: "Terjadi kesalahan: ",
        err_email_req: "Masukkan email Anda.",
        err_reset_fail: "Gagal mengirim link. Pastikan email terdaftar.",
        msg_reset_success: "Link reset telah dikirim ke email Anda. Silakan cek Inbox/Spam.",
        link_forgot: "Lupa password?",
        link_click_here: "Klik disini",
        link_back_login: "Kembali ke Login",
        link_no_account: "Belum punya akun?",
        link_register: "Daftar"
    },
    en: {
        title_login: "Gerobak Login",
        title_reset: "Reset Password",
        ph_email: "Email",
        ph_password: "Password",
        btn_login: "Login",
        btn_loading: "Loading...",
        btn_reset: "Send Reset Link",
        btn_sending: "Sending...",
        err_empty: "Please fill in all fields.",
        err_invalid: "Invalid Email or Password.",
        err_error: "An error occurred: ",
        err_email_req: "Please enter your email.",
        err_reset_fail: "Failed to send link. Make sure the email is registered.",
        msg_reset_success: "Reset link sent to your email. Please check Inbox/Spam.",
        link_forgot: "Forgot password?",
        link_click_here: "Click here",
        link_back_login: "Back to Login",
        link_no_account: "Don't have an account?",
        link_register: "Register"
    }
};

let currentLang = localStorage.getItem("appLang") || "id";

document.addEventListener("DOMContentLoaded", () => {
    updateLanguageUI();
});

function toggleLangDropdown() {
    document.getElementById("langDropdown").classList.toggle("show-dropdown");
}

window.onclick = function(event) {
    if (!event.target.closest('.lang-dropdown-container')) {
        const dropdowns = document.getElementsByClassName("lang-dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
            if (dropdowns[i].classList.contains('show-dropdown')) {
                dropdowns[i].classList.remove('show-dropdown');
            }
        }
    }
}

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("appLang", currentLang);
    updateLanguageUI();
    document.getElementById("langDropdown").classList.remove("show-dropdown");
    clearMsgs();
}

function t(key) {
    return translations[currentLang][key] || key;
}

function updateLanguageUI() {
    const imgLangBtn = document.getElementById("imgLangBtn");
    if (imgLangBtn) {
        if (currentLang === "en") {
            imgLangBtn.src = "image/btn-en.png"; 
        } else {
            imgLangBtn.src = "image/btn-id.png"; 
        }
    }
    const titleKey = isForgotPasswordMode ? "title_reset" : "title_login";
    document.getElementById("formTitle").innerText = t(titleKey);
    const btnKey = isForgotPasswordMode ? "btn_reset" : "btn_login";
    document.getElementById("mainBtn").innerText = t(btnKey);
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerText = t(key);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        el.placeholder = t(key);
    });
}

function togglePasswordVisibility() {
    const passwordInput = document.getElementById("password");
    const toggleIcon = document.getElementById("togglePassword");
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.innerHTML = iconEyeClosed; 
    } else {
        passwordInput.type = "password";
        toggleIcon.innerHTML = iconEyeOpen; 
    }
}

function showForgotPassword() {
    isForgotPasswordMode = true;
    document.getElementById("formTitle").innerText = t("title_reset");
    document.getElementById("passwordArea").style.display = "none";
    document.getElementById("mainBtn").innerText = t("btn_reset");
    document.getElementById("forgotPassLink").style.display = "none";
    document.getElementById("backToLoginLink").style.display = "inline";
    document.getElementById("signUpLink").style.display = "none";
    clearMsgs();
}

function showLogin() {
    isForgotPasswordMode = false;
    document.getElementById("formTitle").innerText = t("title_login");
    document.getElementById("passwordArea").style.display = "block";
    document.getElementById("mainBtn").innerText = t("btn_login");
    document.getElementById("forgotPassLink").style.display = "inline";
    document.getElementById("backToLoginLink").style.display = "none";
    document.getElementById("signUpLink").style.display = "block";
    clearMsgs();
}

function clearMsgs() {
    document.getElementById("errorText").style.display = "none";
    document.getElementById("successText").style.display = "none";
}

function showError(msg) {
    const err = document.getElementById("errorText");
    err.innerText = msg; err.style.display = "block";
}

function showSuccess(msg) {
    const scs = document.getElementById("successText");
    scs.innerText = msg; scs.style.display = "block";
}

function handleAuth() {
    if (isForgotPasswordMode) {
        resetPassword();
    } else {
        login();
    }
}

function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("mainBtn");
  
  if (!email || !password) { 
      showError(t("err_empty")); 
      return; 
  }
  
  btn.innerText = t("btn_loading"); 
  btn.disabled = true;
  clearMsgs();

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      const user = userCredential.user;
      const uid = user.uid;
      
      // Langsung cek database tanpa memeriksa user.emailVerified
      db.ref("vendors/" + uid).once("value").then(snapshot => {
          let role = snapshot.exists() ? "vendor" : "customer";
          localStorage.setItem("vendorUid", uid);
          localStorage.setItem("role", role);
          window.location.href = `index.html?role=${role}`;
      });
    })
    .catch((error) => {
      btn.innerText = t("btn_login"); 
      btn.disabled = false;
      
      if (error.code === "auth/user-not-found" || error.code === "auth/wrong-password" || error.code === "auth/invalid-login-credentials") {
          showError(t("err_invalid"));
      } else {
          showError(t("err_error") + error.message);
      }
    });
}

function resetPassword() {
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("mainBtn");
    if (!email) { showError(t("err_email_req")); return; }
    btn.innerText = t("btn_sending"); 
    btn.disabled = true;
    clearMsgs();
    auth.sendPasswordResetEmail(email)
        .then(() => {
            btn.innerText = t("btn_reset"); btn.disabled = false;
            showSuccess(t("msg_reset_success"));
        })
        .catch((error) => {
            btn.innerText = t("btn_reset"); btn.disabled = false;
            showError(t("err_reset_fail"));
        });
}
</script>
</body>
</html>
