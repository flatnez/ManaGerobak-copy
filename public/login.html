<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Gerobak</title>
</head>
<body>
<h2>Login Gerobak</h2>

<form onsubmit="login(event)">
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>

<p>Belum punya akun? <a href="signup.html">Daftar</a></p>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
    authDomain: "managerobak.firebaseapp.com",
    databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "managerobak",
    storageBucket: "managerobak.firebasestorage.app",
    messagingSenderId: "836881712482",
    appId: "1:836881712482:web:552f5f5085b1acf6df583b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  auth.signInWithEmailAndPassword(email, password)
    .then(userCredential => {
      const uid = userCredential.user.uid;

      // SIMPAN UID
      localStorage.setItem('vendorUid', uid);

      // Redirect aman
      window.location.href = "index.html?role=vendor";
    })
    .catch(error => alert(error.message));
}
</script>

</body>
</html>
