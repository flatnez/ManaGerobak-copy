<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vendor Login</title>
</head>
<body>
  <h2>Login</h2>
  <input id="vendorId" placeholder="Gerobak ID" /><br>
  <input id="password" type="password" placeholder="Password" /><br>
  <button onclick="login()">Login</button>
  <p>Don't have an account? <a href="signup.html">Sign up here</a></p>

  <script>
    async function login() {
      const vendorId = document.getElementById("vendorId").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!vendorId || !password) return alert("Please fill both fields");

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vendorId, password })
      });

      const data = await res.json();
      if (data.success) {
        localStorage.setItem("gerobakId", vendorId);
        window.location.href = "/index.html?role=vendor";
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
