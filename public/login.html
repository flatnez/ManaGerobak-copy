<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Gerobak</title>
</head>
<body>
<h2>Login Gerobak</h2>

<form id="loginForm">
    <input type="text" id="vendorId" placeholder="ID Gerobak" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>

<p>Belum punya akun? <a href="signup.html">Daftar</a></p>
<div id="msg" style="color:red; margin-top:10px;"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  // ====== Konfigurasi Firebase ======
  const firebaseConfig = {
    apiKey: "AIzaSyDsJU5c_tjfJ9mO-xLS6NE_N1gZx-ZmQpk",
  authDomain: "managerobak.firebaseapp.com",
  databaseURL: "https://managerobak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "managerobak",
  storageBucket: "managerobak.firebasestorage.app",
  messagingSenderId: "836881712482",
  appId: "1:836881712482:web:552f5f5085b1acf6df583b",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // ====== Login ======
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const vendorId = document.getElementById("vendorId").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    if (!vendorId || !password) {
      msg.innerText = "ID Gerobak dan password wajib diisi!";
      return;
    }

    try {
      // Gunakan dummy email untuk login
      const email = vendorId + "@dummy.com";
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const uid = userCredential.user.uid;

      localStorage.setItem("vendorUid", uid); // supaya bisa pakai di index.html
      localStorage.setItem("vendorId", vendorId);
      window.location.href = "index.html?role=vendor";
    } catch (error) {
      msg.innerText = error.message;
    }
  });
</script>

</body>
</html>
